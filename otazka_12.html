    <h1>Státnicový test z ČJ (Otázka 12 - Část 1)</h1>
    <div class="subtitle">Didaktika recepce, Literatura 2. pol. 19. století, Malostranské povídky<br><strong>Vyberte odpověď – výsledek a zdůvodnění se zobrazí okamžitě.</strong></div>
    
    <div id="quiz-container"></div>
    
    <button onclick="zobrazitKonecneSkore()">Zobrazit celkové skóre</button>
    <div id="result"></div>

    <script>
        const otazky = [
            // Didaktika
            { q: "Jaký je v didaktice literatury primární rozdíl mezi fází percepce a fází apercepce při žákově recepci uměleckého textu?", options: [
                "Percepce se zaměřuje na historicko-společenský kontext doby, ve které autor tvořil, zatímco apercepce je ryze jazykový rozbor, při kterém žáci určují přesný druh rýmu a metrum v básni.", 
                "Zatímco percepční aktivity jsou vázány na přímé smyslové (auditivní či vizuální) vnímání textu a jeho zvukové stránky, apercepce rozvíjí čtenářskou představivost, fantazii a utváří imaginativní rovinu významů na základě vlastních zkušeností.", 
                "Fáze percepce spočívá v tichém, rychlém čtení rozsáhlých epických děl bez přerušování, kdežto apercepce představuje následné psaní kontrolních vědomostních testů zaměřených na zapamatování hlavních postav.", 
                "Percepce je metoda určená výhradně pro mladší žáky na prvním stupni, kterým se pouští pouze zvukové nahrávky, apercepce se naopak používá na středních školách k výuce složitých literárních směrů a dějin umění."
            ], a: 1, exp: "Fáze percepce (přímé smyslové vnímání) zahrnuje např. kultivaci auditivního vnímání (zvuková stránka, intonace). Fáze apercepce rozvíjí čtenářskou představivost a fantazii, žák si utváří imaginativní rovinu významů na základě svých zkušeností." },
            { q: "Proč se při interpretaci zvukového komplexu básně v percepční fázi nedoporučuje, aby hra s barvami nebo výběrem hudby (tzv. metoda substituce) trvala příliš dlouho?", options: [
                "Dlouhá aktivita by totiž žáky příliš emocionálně vyčerpala, což by mohlo vést k projevům agresivity nebo pláče, které do objektivní literární výchovy podle moderních norem nepatří.", 
                "Úkoly tohoto typu nesmějí být zdlouhavé proto, aby žák neztratil primární kontakt se samotným textem a aby se z interpretační aktivity nestala pouhá samoúčelná, prázdná hra s barvami oddělená od literárního díla.", 
                "Delší časová dotace by nevyhnutelně vedla k tomu, že by žáci začali objevovat chyby v autorově rytmice a metrice, čímž by se narušila didaktická autorita klasických spisovatelů 19. století.", 
                "Tato metoda by při delším trvání odhalila, že žáci ve skutečnosti neznají historická data vzniku básně, což by učitele přinutilo odklonit se od estetiky a vrátit se zpět k memorování životopisů."
            ], a: 1, exp: "Při interpretaci zvukového komplexu (např. 'Vyberte barvu k básni') úkoly nesmějí být zdlouhavé, aby žák neztratil přímý kontakt s textem a aby se z didaktické aktivity nestala jen samoúčelná hra s barvami. Vždy musí následovat zdůvodnění volby opřené o text." },
            { q: "Při didaktické komunikaci se syžetovým (epickým) textem hraje klíčovou roli pochopení vztahu mezi syžetem a fabulí. Jak tyto dva pojmy definujeme?", options: [
                "Syžet představuje chronologický, přirozený sled událostí přesně tak, jak se historicky staly, zatímco fabule je tvořena výhradně dialogy a přímou řečí jednotlivých postav bez zásahu vypravěče.", 
                "Oba pojmy znamenají totéž; používají se pouze k odlišení toho, zda je literární text napsán ve verších (syžet) nebo v souvislé prozaické formě (fabule).", 
                "Syžet je způsob, jakým jsou v literárním díle autorem uspořádány tematické složky (děj může být podán s časovými inverzemi či složitě propleten), zatímco fabule je původní chronologický a logický sled informací a děje.", 
                "Fabule je abstraktní myšlenka nebo morální poselství, které chce autor čtenáři předat, kdežto syžet označuje geografické prostředí a dobu, do které je historický román fyzicky zasazen."
            ], a: 2, exp: "Syžet je konkrétní způsob, jakým autor v díle uspořádal tematické složky (informace o ději mohou být seřazeny s časovými inverzemi, retrospektivou atd.). Fabule představuje samotný obsah děje seřazený v přirozené, chronologické a logické posloupnosti." },

            // Májovci, Ruchovci, Lumírovci
            { q: "Literární generace Májovců, která vstoupila na scénu almanachem Máj (1858), přinesla do české literatury nový program. Které z následujících tvrzení přesně popisuje jejich literární a společenské priority?", options: [
                "Májovci naprosto odmítali jakékoliv zahraniční vlivy; prosazovali únik z reality do staroslovanské mytologie a svá díla psali výhradně formou hrdinských eposů oslavujících husitské vojevůdce a bitvy.", 
                "Jejich hlavním cílem bylo zcela se distancovat od Karla Hynka Máchy, kterého považovali za příliš depresivního; namísto toho požadovali literaturu plnou náboženského fanatismu a slepé oddanosti katolické církvi.", 
                "Navazovali na odkaz Máchy, Havlíčka a Erbena; nechtěli se obracet pouze do historie, ale kladli zásadní důraz na současnost, prosazovali zájem o lidovou tvorbu, skutečné zobrazení denní reality a řešení tehdejší složité sociální situace.", 
                "Skupina Májovců se formovala kolem časopisu Lumír a jejich jediným programem bylo překládat starofrancouzskou poezii, přičemž se naprosto izolovali od politického dění a problémů obyčejného českého venkova."
            ], a: 2, exp: "Májovci (Hálek, Neruda, Světlá, Heyduk, Arbes) se odvolávali na odkaz Máchy (i K.H. Borovského a Erbena). Neobraceli se jen do historie, ale zajímali se o současnost, reálné zobrazení reality, lidovou tvorbu a řešení dobové sociální a evropské situace." },
            { q: "Jakub Arbes, tvůrce specifického literárního žánru zvaného 'romaneto', napsal své stěžejní dílo 'Svatý Xaverius'. Jaká je ústřední myšlenka a zápletka tohoto tajemného příběhu?", options: [
                "Příběh je oslavou fanatické náboženské víry; mladý chlapec Xaverius v malostranském chrámu zázračně oživí barokní sochu světce, která následně potrestá všechny nevěřící obyvatele Prahy za jejich lakomství.", 
                "Hlavním motivem je vítězství chladného rozumu nad náboženskou vírou. Malíř Xaverius se snaží racionálně rozluštit tajnou šifru ukrytou v obraze v chrámu sv. Mikuláše, jež má vést k nesmírnému pokladu; po neúspěchu a věznění však nakonec tragicky umírá na tuberkulózu.", 
                "Děj vypráví o milostném trojúhelníku mezi studentem, krásnou Josefínkou a bohatým starcem Xaveriem. Osobní spory vyústí v krvavý souboj přímo na Karlově mostě, kde Xaverius získá lásku za pomoci černé magie.", 
                "Romaneto popisuje utopickou společnost budoucnosti. Vědec Xaverius sestrojí v katakombách pod Prahou stroj času a vydává se do doby ukřižování Krista, aby empiricky dokázal, že bible je pouze snůška lží."
            ], a: 1, exp: "Romaneto (rozsáhlejší povídka s napínavým, rozumově vysvětleným tajemstvím) Svatý Xaverius pojednává o vítězství rozumu nad vírou. Xaverius se snaží pomocí logiky a překreslování obrazu v chrámu sv. Mikuláše najít poklad. Skončí ovšem neúspěchem, je zatčen a umírá marně na souchotiny (tuberu)." },
            { q: "Generace Ruchovců (Škola národní) a Lumírovců (Škola kosmopolitní) formovaly českou literaturu v 70. a 80. letech 19. století. Jaký byl mezi nimi hlavní názorový a umělecký rozdíl?", options: [
                "Ruchovci psali výhradně německy a podporovali silnou orientaci na Vídeň, zatímco Lumírovci byli zarytými českými nacionalisty, kteří zakazovali překlady cizojazyčných knih a čerpali pouze z Kosmovy kroniky.", 
                "Ruchovci se vyznačovali silným vlastenectvím, obraceli se k Rusku (slovanství) a upřednostňovali venkov a historická témata. Lumírovci se naopak snažili povznést českou literaturu na světovou úroveň, překládali západní díla a experimentovali s novými formami jako sonety či rondely.", 
                "Lumírovci byli představitelé tvrdého, syrového naturalismu opisujícího život pražské lůzy a dělníků, kdežto Ruchovci se zabývali pouze psaním bezobsažných pohádek a milostných románků pro mladé dívky z vyšší společnosti.", 
                "Obě skupiny měly naprosto stejný program zaměřený na boj proti rakouské cenzuře; lišily se pouze v tom, že Ruchovci publikovali své texty ilegálně v zahraničí, zatímco Lumírovci je předčítali přímo v budově Národního divadla."
            ], a: 1, exp: "Ruchovci (S. Čech, E. Krásnohorská) byli 'Školou národní', prosazovali vlastenectví, slovanství, obdiv k venkovu a národní historii. Lumírovci (Vrchlický, Zeyer, Sládek) představovali 'Školu kosmopolitní', otevírali literaturu Západu, překládali a experimentovali s formami (sonety), aby povznesli českou literaturu na světovou úroveň." },
            { q: "Významný představitel Lumírovců, Julius Zeyer, ve svém díle často využíval exotické motivy, mystiku a novoromantismus. O čem pojednává část jeho knihy 'Tři legendy o krucifixu' s názvem 'Inultus'?", options: [
                "Vypráví se zde příběh italské sochařky Flavie, která ze zoufalství a snahy zachytit absolutní, realistický výraz umučení a bolesti pro svůj kříž krutě a záměrně utýrá a probodne mladého modela Inulta; sochařka nakonec pod tíhou svého svědomí a viny spáchá v žaláři sebevraždu.", 
                "Děj sleduje putování osiřelého chlapce Inulta, který se vydává do Palestiny hledat původní kříž, na němž zemřel Kristus. Po cestě koná zázraky, obrátí na víru sultána a je anděly vzat zaživa do nebe.", 
                "Je to temný příběh z pražského židovského města, kde bohatý kupec Inultus z nenávisti otráví posvátnou hostii; za trest se promění ve stvůru podobnou Golemovi, která musí navěky bloudit starým hřbitovem.", 
                "Pojednává o sochaři Inultovi, který se nešťastně zamiluje do vlastní mramorové sochy madony; svými modlitbami sochu oživí, ale zjistí, že dívka je ve skutečnosti zlý démon toužící zničit celé město požárem."
            ], a: 0, exp: "Tři legendy o krucifixu spojuje téma kříže a utrpení. Příběh 'Inultus' se odehrává v Praze, kde fanatická sochařka Flavia (sympatizantka Španělů) pro zobrazení utrpení Krista pomalu ubodá chudého mladíka Inulta. Sama se pod tíhou uznání svého hrůzného díla a svědomí oběsí ve sklepě." },

            // Historická a venkovská próza
            { q: "Česká historická próza 19. století je úzce spjata se jmény Aloise Jiráska a Václava Beneše Třebízského. V čem spočívá hlavní rozdíl mezi tvorbou těchto dvou klasiků?", options: [
                "Jirásek psal svá díla s obrovskou dávkou sarkasmu a humoru a zesměšňoval husity jako pouhé rváče, zatímco Třebízský psal tlusté a vážné historické knihy opěvující krásu habsburského panovnického dvora.", 
                "Třebízský se soustředil na obsáhlé, vícedílné chronologické fresky mapující celá staletí dějin od husitství až po obrození (např. F.L. Věk), kdežto Jirásek tvořil pouze krátké hororové povídky z pražských hřbitovů.", 
                "Jirásek je autorem rozsáhlých chronologických epochálních cyklů a fresek zachycujících husitství, pobělohorské temno či národní obrození s cílem povzbudit národ (Mezi proudy, Bratrstvo, Temno). Třebízský (katolický kněz) se naopak obliboval v lokálnějších, melancholických a tragických námětech ze selských bouří a pobělohorské doby (Bludné duše).", 
                "Jirásek se ve svém díle zabýval výhradně překlady antických eposů o pádu Tróje, zatímco Třebízský založil literární časopis Ruch a diktoval směr celé mladé generace autorů zajímajících se o moderní průmysl."
            ], a: 2, exp: "Jirásek mapoval formou románových fresek a velkých cyklů ucelená období národních dějin (husitství – Mezi proudy, Proti všem; Temno, F.L. Věk). Třebízský se jako kněz zajímal o husitství, ale zejména o tragické osudy, pobělohorské melancholické úpadky a lokální selské vzpoury (Bludné duše, Královna Dagmar)." },
            { q: "Karel Václav Rais, představitel venkovské prózy, se ve svých románech zabýval sociálními a generačními problémy venkova. O čem pojednává jeho tragický román 'Kalibův zločin'?", options: [
                "Příběh vypráví o brutálním sériovém vrahovi Kalibovi, který po nocích přepadává formanské vozy v hlubokých podkrkonošských lesích, dokud není polapen a spravedlivě popraven místním farářem.", 
                "Zachycuje tragédii vesnického dobráka Vojty Kaliby, kterého jeho vlastní manželka (Karla) a chamtivá tchyně svými neustálými intrikami, nevěrou a psychickým terorem doženou k absolutnímu šílenství, které vyvrcholí tím, že Kaliba svou ženu v afektu zavraždí a sám umírá.", 
                "Jedná se o vtipnou komedii plnou omylů, kdy hloupý, ale dobrosrdečný sedlák Kaliba omylem ukradne starostovi obecní pokladnu, ale po řadě absurdních situací ji nepozorovaně vrátí zpět a stane se místním hrdinou.", 
                "Děj sleduje úpadek zbohatlické mlynářské rodiny Kalibů; starý mlynář z přepychu zešílí, zapálí svůj vlastní mlýn, aby ho nemusel předat synovi, a rodina končí po zbytek života v naprosté a bolestivé bídě ve městě."
            ], a: 1, exp: "Kalibův zločin je krutá tragédie. Dobrosrdečný, starší a měkký Vojta Kaliba se ožení s mladší Karlou. Ta ho i se svou matkou (Boučkovou) systematicky psychicky deptají, ponižují, vyženou z domu a Karla je mu nevěrná. Kaliba v návalu zoufalství a šílenství manželku zabije a sám vzápětí umírá na mrtvici." },
            { q: "Dalším významným autorem a fejetonistou byl Ignát Herrmann. V jeho románu 'U snědeného krámu' je zobrazen pád pražského obchodníka Martina Žemly. Kdo nese hlavní vinu na jeho naprosté existenční a životní katastrofě?", options: [
                "Jeho zkázu způsobí nemilosrdný konkurenční židovský obchodník z vedlejší ulice, který Žemlovi cíleně podpaluje sklady a neustále znehodnocuje a špiní jeho pověst v místních vlivných novinách.", 
                "Zkázu mu přináší především jeho vlastní lehkovážná a chamtivá manželka Pavlína (dcera plukovníka) a její marnotratná matka; svými intrikami, bezcitností a bezhlavým rozhazováním peněz na večírky slabého a poddajného kupce ekonomicky vysají, až je krám zlikvidován a on končí sebevraždou.", 
                "Za krach může fanatický náboženský kazatel, který přesvědčí pražskou chudinu, že potraviny ze Žemlova krámu jsou prokleté, což vede k hromadnému bojkotu a Žemla končí v blázinci.", 
                "Vinu nese Žemla sám, protože propadl nezvladatelnému gamblerství, začal hrát hazardní karty se zkorumpovanými rakouskými oficíry a celý svůj prosperující obchod v jedné temné noci hanebně a fatálně prohrál."
            ], a: 1, exp: "U snědeného krámu líčí tragédii slabošského, osamělého kupce Martina Žemly. Vinu nese jeho žena Pavlína a její matka (Šustrová), které ho dohnaly k bankrotu svým parazitickým chováním, intrikami a rozhazováním zisků. Ožebračený Žemla spáchá sebevraždu." },

            // Jan Neruda (Život a sbírky)
            { q: "Jaký zásadní obsahový rozdíl je mezi Nerudovými básnickými sbírkami 'Knihy veršů' a 'Písně kosmické'?", options: [
                "Knihy veršů se výhradně zabývají humornými zvířecími bajkami pro děti, zatímco Písně kosmické jsou tvrdou, nesmlouvavou politickou kritikou katolické církve a papeže.", 
                "Knihy veršů jsou plné radostných a bujarých milostných vyznání k Anně Tiché, kdežto Písně kosmické líčí hlubokou depresi a marnost z blížící se smrti v tmavých kulisách starých hřbitovů.", 
                "Knihy veršů (rozdělené na epickou, lyrickou a příležitostnou část) obsahují sociální tematiku (např. Dědova mísa), skepsi a osobní i rodinnou hořkost. Písně kosmické představují nečekaně optimistický náhled na svět; autor v nich vyjadřuje obdiv k vesmíru, vědě, technickému pokroku a vtěluje do nich hrdost a ideály svobody i demokracie.",

        // Didaktika - Závěr (Metody práce s textem)
        { q: "Jaký je hlavní rozdíl mezi takzvanou 'fabulí' a 'syžetem' v literárním uměleckém díle?", options: [

        { q: "Při didaktické interpretaci textu v hodinách literatury zdůrazňuje vyučující (např. u metody vnitřní fotografie) nutnost odůvodňování volby. Proč nesmí aktivity zaměřené na zvukovou či grafickou představivost trvat příliš dlouho bez následné reflexe?", options: [
            "Úkoly by se zvrhly do samoúčelné hry (např. pouhé hádání barev bez souvislosti). Dlouhým trváním by žák ztratil přímý kontakt se smyslem textu; je nezbytné, aby žák své představy vždy logicky a s ohledem na text zdůvodnil.",

            "Didaktika přísně zakazuje propojování literatury s výtvarnými nebo hudebními prvky; podobné hry proto nesmějí trvat dlouho, aby výuka nesklouzla do neobjektivního, subjektivního diletantismu, který nemá s vědou nic společného."
        ], a: 0, exp: "Metodika práce se zvukovým či vizuálním komplexem básně (výběr hudby, barev, vnitřní fotografie) má sloužit k uchopení nálady a významu textu. Úkoly však nesmějí být zdlouhavé, aby z nich nestala samoúčelná, prázdná hra a aby žák neztratil kontakt s původním slovem. Klíčovým prvkem je vždy následné logické zdůvodnění žákovy volby s odkazem na text." }
    ];
        ];

        let score = 0;
        let answeredQuestions = 0;

        const container = document.getElementById('quiz-container');

        // Generování HTML a okamžité vyhodnocení
        otazky.forEach((otazka, index) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `q-card-${index}`;
            
            const title = document.createElement('div');
            title.className = 'question-title';
            title.textContent = `${index + 1}. ${otazka.q}`;
            card.appendChild(title);

            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'options';

            otazka.options.forEach((opt, optIndex) => {
                const label = document.createElement('label');
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = `q${index}`;
                radio.value = optIndex;
                
                radio.addEventListener('change', function() {
                    const currentCard = document.getElementById(`q-card-${index}`);
                    const allRadios = currentCard.querySelectorAll('input[type="radio"]');
                    const labels = currentCard.querySelectorAll('label');
                    const expDiv = document.getElementById(`exp${index}`);
                    
                    // Uzamknutí otázky
                    allRadios.forEach(r => r.disabled = true);
                    currentCard.classList.add('locked');

                    const selectedVal = parseInt(this.value);
                    const correctVal = otazky[index].a;

                    labels[correctVal].classList.add('correct');

                    if (selectedVal === correctVal) {
                        score++;
                        expDiv.className = 'explanation success';
                        expDiv.innerHTML = `<strong>Správně!</strong><br><strong>Zdůvodnění:</strong> ${otazky[index].exp}`;
                    } else {
                        labels[selectedVal].classList.add('incorrect');
                        expDiv.className = 'explanation error';
                        expDiv.innerHTML = `<strong>Špatně.</strong><br>
                                            <strong>Správná odpověď:</strong> <em>${otazky[index].options[correctVal]}</em><br>
                                            <strong>Zdůvodnění:</strong> ${otazky[index].exp}`;
                    }
                    expDiv.style.display = 'block';
                    answeredQuestions++;
                });

                label.appendChild(radio);
                label.appendChild(document.createTextNode(opt));
                optionsDiv.appendChild(label);
            });

            card.appendChild(optionsDiv);

            const explanationDiv = document.createElement('div');
            explanationDiv.className = 'explanation';
            explanationDiv.id = `exp${index}`;
            card.appendChild(explanationDiv);

            container.appendChild(card);
        });

        // Finální shrnutí na konci
        function zobrazitKonecneSkore() {
            const resultDiv = document.getElementById('result');
            
            if (answeredQuestions < otazky.length) {
                resultDiv.style.color = '#e67e22';
                resultDiv.innerHTML = `Zatím jste odpověděl/a na ${answeredQuestions} z ${otazky.length} otázek. <br> Průběžné skóre: ${score} správně.`;
                return;
            }

            const percent = Math.round((score / otazky.length) * 100);
            resultDiv.innerHTML = `Váš konečný výsledek: ${score} z ${otazky.length} bodů (${percent} %).`;
            
            if(percent >= 80) {
                resultDiv.style.color = '#27ae60';
                resultDiv.innerHTML += "<br>Vynikající výkon! I u chytáků jste se zorientoval skvěle.";
            } else if (percent >= 50) {
                resultDiv.style.color = '#f39c12';
                resultDiv.innerHTML += "<br>Slušný výsledek. Otázky byly těžké a podrobné – projděte si u chyb zdůvodnění v rámečcích.";
            } else {
                resultDiv.style.color = '#c0392b';
                resultDiv.innerHTML += "<br>Tohle bylo hodně těžké. Neruda a realismus 19. století mají obrovské množství detailů. Pečlivé čtení rámečků vám ale pomůže!";
            }
        }
