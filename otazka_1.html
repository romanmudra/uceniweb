<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Státnicový test ČJ - Otázka 1</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; max-width: 900px; margin: 0 auto; padding: 20px; line-height: 1.6; }
        h1 { text-align: center; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .question-card { background: #fff; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 5px solid #3498db; }
        .question-title { font-weight: bold; font-size: 1.1em; margin-bottom: 15px; }
        .options label { display: block; background: #f9f9f9; padding: 10px 15px; margin-bottom: 8px; border-radius: 5px; cursor: pointer; transition: 0.2s; border: 1px solid #e0e0e0; }
        .options label:hover { background: #eef2f5; }
        .locked label { cursor: not-allowed; pointer-events: none; }
        input[type="radio"] { margin-right: 10px; }
        button { display: block; width: 100%; padding: 15px; font-size: 1.2em; background-color: #2c3e50; color: white; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; margin-top: 30px; margin-bottom: 50px; }
        button:hover { background-color: #1a252f; }
        .correct { background-color: #d4edda !important; border-color: #c3e6cb !important; color: #155724; font-weight: bold; }
        .incorrect { background-color: #f8d7da !important; border-color: #f5c6cb !important; color: #721c24; }
        .explanation { margin-top: 15px; padding: 15px; border-radius: 4px; font-size: 0.95em; display: none; }
        .explanation.success { background-color: #d4edda; border-left: 5px solid #28a745; color: #155724; }
        .explanation.error { background-color: #fff3cd; border-left: 5px solid #dc3545; color: #856404; }
        #result { font-size: 1.5em; text-align: center; font-weight: bold; margin-bottom: 20px; color: #2c3e50; }
    </style>
</head>
<body>

    <h1>Státnicový test z ČJ (Otázka 1)</h1>
    <p style="text-align:center;">Václav Havel, Divadla malých forem a Didaktika (Úvod)</p>
    
    <div id="quiz-container"></div>
    <button onclick="zobrazitKonecneSkore()">Zobrazit celkové skóre</button>
    <div id="result"></div>

    <script>
        const otazky = [
            { q: "Jakou profesi vykonával Václav Havel poté, co byl v 50. letech z politických důvodů vyloučen ze studia na gymnáziu?", options: ["Pracoval jako kulisák v Národním divadle.", "Pracoval jako chemický laborant na VŠCHT.", "Pracoval jako skladník v pardubickém pivovaru.", "Ihned se živil jako spisovatel ve svobodném povolání."], a: 1, exp: "Podle poznámek pracoval jako chemický laborant po svém vyloučení ze studia (ještě před divadlem)." },
            { q: "Co je podle poskytnutých materiálů primárním znakem TRADIČNÍHO pojetí literární výchovy?", options: ["Využívá se především myšlenkového postupu indukce.", "Žák se stává partnerem učitele a může zasahovat do průběhu hodiny.", "Učitel vystupuje pouze jako garant metody.", "Žák je pasivním příjemcem informací a převládá memorování učiva."], a: 3, exp: "Tradiční pojetí vychází z herbartovského systému, centrum tvoří učitel a žáci si předem hotové informace pouze pamatují." },
            { q: "Která divadelní hra byla prvním představením divadla Semafor po jeho založení v roce 1959?", options: ["Člověk z půdy", "Kdyby tisíc klarinetů", "Jonáš a tingltangl", "Zahradní slavnost"], a: 0, exp: "První hrou divadla Semafor (založeného J. Suchým a J. Šlitrem) byla komedie Člověk z půdy." },
            { q: "O čem pojednává absurdní drama Václava Havla s názvem Audience?", options: ["Dva disidenti diskutují o tom, zda podepsat nebo nepodepsat Chartu 77.", "Zavádění nového syntetického jazyka do běžné byrokracie.", "Sládek přemlouvá podřízeného Vaňka, aby na sebe psal donášecí zprávy.", "Manželský pár předvádí svému známému dokonale zařízený byt."], a: 2, exp: "Sládek v pivovaru musí podávat hlášení o Vaňkovi, ale protože to neumí napsat, navrhne absurdní řešení – aby na sebe donášel Vaněk sám." },
            { q: "Které divadlo je charakteristické pořádáním tzv. „vědeckých přednášek“, toporným ztvárněním a parodováním českých vlastností?", options: ["Divadlo Járy Cimrmana", "Divadlo Na zábradlí", "Husa na provázku", "Studio Y"], a: 0, exp: "Poznámky jasně definují tyto znaky u Divadla Járy Cimrmana, za kterým stojí L. Smoljak a Z. Svěrák." },
            { q: "Jak chápe recepční estetika kostnické školy roli prázdných míst v literárním textu?", options: ["Představují chyby autora, které učitel musí žákům jednoznačně vysvětlit.", "Čtenář je díky nim nucen text dotvářet a podílí se tak na spoluvytváření díla.", "Slouží výhradně k procvičování gramatických a syntaktických jevů.", "Jsou to cenzurované pasáže, které byly v 70. letech odstraněny."], a: 1, exp: "Prázdná místa (nedořečenosti) podněcují čtenářovu představivost (imaginační proces) a nutí ho text interpretovat." },
            { q: "Které z následujících děl NEPATŘÍ do dramatické tvorby Václava Havla?", options: ["Konec masopustu", "Vyrozumění", "Pokoušení", "Zahradní slavnost"], a: 0, exp: "Konec masopustu je drama Josefa Topola, nikoliv Václava Havla." },
            { q: "Jaké duševní vlastnosti charakterizují postavu Ferdinanda Vaňka ve hře Audience?", options: ["Je nesmělý, spořádaný, komunikuje jasně a stroze.", "Je velmi hovorný, užívá vulgární slova a nabízí všem pivo.", "Je výmluvný a rád vzpomíná na svou bývalou práci hrobaře.", "Je agresivní a neustále Sládkovi vyhrožuje svými kontakty v disentu."], a: 0, exp: "Ferdinand Vaněk je alter egem V. Havla – tichý intelektuál, který odpovídá slušně, ale stručně (na rozdíl od Sládka)." },
            { q: "Co zahrnuje „dynamický proces“ v rámci četby podle recepční estetiky?", options: ["Pohyb žáků po třídě při dramatické výchově.", "Doplňování chybějících detailů o vzhledu a oblečení postav.", "Změnu tradičního pojetí literární výchovy na komunikativní pojetí.", "Formulování očekávání čtenáře a jejich následné potvrzování, či zklamávání během čtení."], a: 3, exp: "Dynamický proces znamená, že se vnímání textu v čase mění – čtenář si vytváří odhady děje, a pokud se nevyplní, musí svá očekávání přehodnotit." },
            { q: "Které divadlo proslavil Ivan Vyskočil využíváním tzv. text-appealů?", options: ["Činoherní klub", "Reduta", "Divadlo za branou", "Semafor"], a: 1, exp: "Reduta (založena 1957) je přímo spjata s Ivanem Vyskočilem a žánrem text-appealů." }
        ];

        let score = 0; let answeredQuestions = 0;
        const container = document.getElementById('quiz-container');

        otazky.forEach((otazka, index) => {
            const card = document.createElement('div'); card.className = 'question-card'; card.id = `q-card-${index}`;
            const title = document.createElement('div'); title.className = 'question-title'; title.textContent = `${index + 1}. ${otazka.q}`; card.appendChild(title);
            const optionsDiv = document.createElement('div'); optionsDiv.className = 'options';

            otazka.options.forEach((opt, optIndex) => {
                const label = document.createElement('label'); const radio = document.createElement('input');
                radio.type = 'radio'; radio.name = `q${index}`; radio.value = optIndex;
                
                radio.addEventListener('change', function() {
                    const currentCard = document.getElementById(`q-card-${index}`);
                    const allRadios = currentCard.querySelectorAll('input[type="radio"]');
                    const labels = currentCard.querySelectorAll('label');
                    const expDiv = document.getElementById(`exp${index}`);
                    
                    allRadios.forEach(r => r.disabled = true); currentCard.classList.add('locked');
                    const selectedVal = parseInt(this.value); const correctVal = otazky[index].a;
                    labels[correctVal].classList.add('correct');

                    if (selectedVal === correctVal) {
                        score++; expDiv.className = 'explanation success';
                        expDiv.innerHTML = `<strong>Správně!</strong><br><strong>Zdůvodnění:</strong> ${otazky[index].exp}`;
                    } else {
                        labels[selectedVal].classList.add('incorrect'); expDiv.className = 'explanation error';
                        expDiv.innerHTML = `<strong>Špatně.</strong><br><strong>Správná odpověď:</strong> <em>${otazky[index].options[correctVal]}</em><br><strong>Zdůvodnění:</strong> ${otazky[index].exp}`;
                    }
                    expDiv.style.display = 'block'; answeredQuestions++;
                });

                label.appendChild(radio); label.appendChild(document.createTextNode(opt)); optionsDiv.appendChild(label);
            });
            card.appendChild(optionsDiv);
            const explanationDiv = document.createElement('div'); explanationDiv.className = 'explanation'; explanationDiv.id = `exp${index}`;
            card.appendChild(explanationDiv); container.appendChild(card);
        });

        function zobrazitKonecneSkore() {
            const resultDiv = document.getElementById('result');
            if (answeredQuestions < otazky.length) {
                resultDiv.style.color = '#e67e22'; resultDiv.innerHTML = `Zatím jste odpověděl/a na ${answeredQuestions} z ${otazky.length} otázek. <br> Průběžné skóre: ${score} správně.`; return;
            }
            const percent = Math.round((score / otazky.length) * 100); resultDiv.innerHTML = `Váš konečný výsledek: ${score} z ${otazky.length} bodů (${percent} %).`;
        }
    </script>
</body>
</html>
