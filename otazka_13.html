<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Státnicový test ČJ - Otázka 13 (Kompletních 50 otázek)</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; line-height: 1.6; }
        .question-card { background: #fff; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .options label { display: block; background: #f9f9f9; padding: 10px; margin: 5px 0; cursor: pointer; border: 1px solid #ddd; }
        .correct { background-color: #d4edda !important; }
        .incorrect { background-color: #f8d7da !important; }
        .explanation { display: none; margin-top: 10px; padding: 10px; border-left: 4px solid #3498db; background: #eef; }
    </style>
</head>
<body>
    <h1>Státnicový test z ČJ (Otázka 13 - Kompletní)</h1>
    <div id="quiz-container"></div>
    <button onclick="zobrazitKonecneSkore()" style="width:100%; padding:20px; font-size:1.2em;">Zobrazit celkové skóre</button>
    <div id="result" style="text-align:center; font-size:1.5em; margin:20px;"></div>

    <script>
        const otazky = [
            // Didaktika recepce (Percepce, Apercepce, Syžet/Fabule) - 10 otázek
            { q: "Jaký je primární rozdíl mezi fází percepce a fází apercepce při recepci uměleckého textu?", options: ["Percepce se zaměřuje na kontext doby, zatímco apercepce je ryze jazykový rozbor.", "Percepce je vázána na smyslové vnímání textu, kdežto apercepce rozvíjí čtenářskou představivost a imaginativní rovinu.", "Percepce slouží ke shrnutí děje po četbě, kdežto apercepce probíhá před četbou.", "Percepce je pro mladší žáky, apercepce pro středoškoláky."], a: 1, exp: "Percepce je přímé smyslové vnímání. Apercepce rozvíjí představivost a utváří imaginativní rovinu významů." },
            { q: "Proč se u aktivit typu 'výběr barvy' k básni nedoporučuje, aby trvaly příliš dlouho?", options: ["Žáci by se příliš vyčerpali a narušili by průběh hodiny.", "Tyto metody nemají žádný přínos pro porozumění textu.", "Úkoly nesmějí být zdlouhavé, aby žák neztratil kontakt s textem a vždy následovalo zdůvodnění.", "Delší trvání by odhalilo chyby v autorově metrice."], a: 2, exp: "Cílem je uchopení nálady, nikoliv samoúčelná hra. Dlouhé trvání odvádí pozornost od textu." },
            { q: "Jak definujeme vztah mezi syžetem a fabulí?", options: ["Fabule je ponaučení, syžet jsou postavy.", "Fabule je veršovaná forma, syžet je prozaická forma.", "Syžet je způsob autorského uspořádání tematických složek, fabule je chronologický sled událostí.", "Syžet jsou historická fakta, fabule jsou smyšlené odbočky."], a: 2, exp: "Fabule je chronologický sled děje. Syžet je kompoziční ztvárnění autora (inverze, retrospektiva)." },
            { q: "Co je hlavním cílem 'metody vnitřní fotografie' při práci s textem?", options: ["Naučit žáky kreslit přesné ilustrace k příběhu.", "Vytvořit si vlastní vnitřní představu o postavách a prostředí v souladu s textem.", "Přepsat děj povídky do podoby moderního komiksu.", "Zapamatovat si přesný popis oblečení všech postav."], a: 1, exp: "Metoda vnitřní fotografie pomáhá žákům konkretizovat smysl díla a vytvořit si živou představu postav a prostředí." },
            { q: "Jaké riziko představuje pro žáky 'mimostrukturní představa' při interpretaci?", options: ["Přílišná věrnost textu a jeho významům.", "Možnost vést až k destrukci původního významu textu.", "Příliš rychlé přečtení literárního díla.", "Ztráta zájmu o historické souvislosti doby."], a: 1, exp: "Mimostrukturní představy se mohou odchylovat od intencí textu natolik, že vedou k jeho mylné interpretaci či destrukci." },
            { q: "Co je podstatou interpretace zvukového komplexu básně?", options: ["Analýza frekvence slov v básni.", "Vnímání básně hlasitým přednesem a vnímání asociací zvukové stránky.", "Přepis básně do notového zápisu.", "Mechanické určování počtu slabik ve verši."], a: 1, exp: "Interpretace zvukového komplexu pracuje se znělostí, konotací a asociací zvuku, které mají umělecký záměr." },
            { q: "Proč vedeme žáky k 'interpretaci v roli' (např. divadelník, scénograf)?", options: ["Aby se naučili být herci v profesionálním divadle.", "Aby lépe pochopili syžet a motivace postav.", "Aby se zbavili strachu z veřejného vystupování.", "Aby nemuseli znát literární historii."], a: 1, exp: "Role (divadelník, výtvarník) nutí žáka hlouběji přemýšlet o syžetu, postavách a dobových reáliích." },
            { q: "Co je to 'didaktická substituce'?", options: ["Změna názvu literárního díla žáky.", "Nahrazení nejasného pocitu z četby jiným médiem (barva, hudba).", "Oprava gramatických chyb v textu.", "Vynechání poloviny knihy při výuce."], a: 1, exp: "Substituce pomáhá žákům vyjádřit emoce z textu pomocí jiného média (barva, nástroj), pokud jim chybí slovní vyjádření." },
            { q: "Co znamená 'rekonstrukce' při interpretaci textu?", options: ["Přepis celého díla rukou.", "Dotváření vynechaných částí textu s didaktickým záměrem.", "Zjišťování, zda autor knihu skutečně napsal.", "Srovnávání překladů různých autorů."], a: 1, exp: "Rekonstrukce je tvořivá aktivita dotváření chybějících částí (např. závěru) a následné porovnání s originálem." },
            { q: "Co sleduje aktivita 'báseň s mnoha konci'?", options: ["Rychlost psaní rýmů.", "Komparaci žákova závěru s autorovým poselstvím.", "Zapamatování dlouhých básní.", "Analýzu gramatiky v závěru básně."], a: 1, exp: "Žáci tvoří závěr a uvědomují si pointu a poselství, následně komparují s originálem." },

            // Erben - Kytice (10 otázek)
            { q: "Karel Jaromír Erben - Kytice. Co symbolizuje kvítek mateřídoušky na hrobě v titulní básni?", options: ["Symbol věčného zapomnění.", "Symbolizující duši mrtvé matky (vlasti), která prosí o zastání.", "Je to jen náhodná dekorace bez významu.", "Symbol křesťanské pokory."], a: 1, exp: "Kvítek mateřídoušky představuje duši mrtvé matky, která se vrací a prosí své dcery a syny o pomoc a lásku (symbol vlasti)." },
            { q: "V baladě Poklad poruší žena řád Velkého pátku tím, že:", options: ["Zpívá v kostele falešně.", "Půjčuje si peníze a touží po bohatství ve skále.", "Odmítá jít na mši.", "Okrade místního lichváře."], a: 1, exp: "Žena poruší tradici Velkého pátku tím, že se nechá zlákat bohatstvím ve skále, i když se na tento den nemá půjčovat ani nic dít." },
            { q: "Proč balada Svatební košile končí smířením?", options: ["Umrlec si dívku odvede do pekla.", "Umrlec je zahnán modlitbou a svítáním.", "Dívka se stane umrlcovou ženou.", "Umrlec se změní v anděla."], a: 1, exp: "Dívka se modlí a v poslední chvíli je zachráněna před umrlcem (přicházející smrtí) díky boží pomoci a svítání." },
            { q: "V baladě Polednice dojde k tragédii, protože matka:", options: ["Dítě úmyslně zabije.", "Ztratí nervy ze zlobení a přivolá Polednici.", "Zapomene dítě v lese.", "Se rozhodne odejít od rodiny."], a: 1, exp: "Matka v hněvu ze zlobení přivolá Polednici, která dítě v náručí udusí." },
            { q: "Co je hlavním motivem Záhořova lože?", options: ["Potrestání zločince pekelným ohněm.", "Možnost spásy skrze pokání a odpor proti zlu.", "Boj s draky v podsvětí.", "Pomsta za zrazenou lásku."], a: 1, exp: "Záhořovo lože ukazuje, že i největší hříšník (Záhoř) může dojít vykoupení skrze pokání." },
            { q: "V čem spočívá tragika matky v baladě Vodník?", options: ["Dcera ji odmítá poslouchat a odejde k vodníkovi.", "Matka své dítě po návratu z vodní říše nepoznává.", "Matka dítě zabije z hněvu.", "Dítě je navždy ztraceno, protože dcera neuposlechla matčinu radu."], a: 3, exp: "Dcera neuposlechla varování matky, vzala si vodníka a její dítě je vodníkem po roztržce zabito a položeno na práh jako trest." },
            { q: "Co se stane s ženou v baladě Vrba?", options: ["Promění se v labuť.", "Je usmrcena poté, co manžel porazí vrbu, ve které sídlí její duše.", "Uteče do kláštera.", "Je zakleta čarodějnicí v kámen."], a: 1, exp: "Manžel ve snaze 'vyléčit' ženu (duše v noci ve vrbě) vrbu porazí, čímž ji nevědomky usmrtí." },
            { q: "Kdo proklíná matku v baladě Dceřina kletba?", options: ["Sestra.", "Dcera, která zabila své dítě.", "Otec.", "Sousedka."], a: 1, exp: "Dcera zabila dítě a před popravou proklíná matku za špatnou, příliš volnou výchovu." },
            { q: "Jakou roli hraje ve Svatební košili 'modlitební knížka'?", options: ["Je to zbraň proti umrlci.", "Nástroj, který dívka nesmí mít u sebe.", "Dar od milého.", "Kniha, kterou dívka nečte."], a: 1, exp: "Umrlec dívku varuje, že když s ním chce odejít, nesmí mít u sebe modlitební knížky (nebo růženec, křížek), protože by jí nemohl ublížit." },
            { q: "Jaký je závěr balady Lilie?", options: ["Dívka se vrátí mezi živé.", "Pán najde ženu i dítě mrtvé poté, co je matka nechala na slunci.", "Rodina odjíždí do ciziny.", "Pán zabije matku."], a: 1, exp: "Matka nechá snachu s dítětem na slunci a z nenávisti je nechá zahynout. Když se pán vrátí, najde je mrtvé." },

            // Národní obrození - 15 otázek
            { q: "Václav Matěj Kramerius založil:", options: ["Královskou společnost nauk.", "Českou expedici.", "Klub přátel poezie.", "Matici českou."], a: 1, exp: "Kramerius založil nakladatelství Česká expedice." },
            { q: "Václav Thám vydal almanach:", options: ["Máj.", "Básně v řeči vázané.", "Krok.", "Hlasatel český."], a: 1, exp: "Thám vydal almanach Básně v řeči vázané." },
            { q: "Josef Jungmann se proslavil:", options: ["Pětidílným Slovníkem česko-německým.", "Překladem Bible kralické.", "Vydáváním novin v 18. století.", "Psaním husitských eposů."], a: 0, exp: "Jungmann vytvořil pětidílný Slovník česko-německý." },
            { q: "Rukopisy (Královedvorský a Zelenohorský) byly považovány za:", options: ["Dílo J. A. Komenského.", "Autentické památky rané české literatury.", "Dílo Jana Husa.", "Padělky Václava Tháma."], a: 1, exp: "Rukopisy byly považovány za autentické památky, později se ukázaly jako padělky (Hanka, Linda)." },
            { q: "Co je tématem Kollárovy 'Slávy dcery'?", options: ["Války husitů.", "Slovanská vzájemnost a Mína.", "Život na venkově.", "Historie českých králů."], a: 1, exp: "Slávy dcera je o slovanské vzájemnosti a lásce k Míně." },
            { q: "Co napsal František Ladislav Čelakovský?", options: ["Máj.", "Ohlas písní ruských.", "Kytici.", "Fialky."], a: 1, exp: "Čelakovský napsal Ohlas písní ruských a českých." },
            { q: "Jaký verš Mácha využil v Máji?", options: ["Volný verš.", "Jambický verš.", "Časoměrný verš.", "Pravidelný rým s vysokou obrazností."], a: 3, exp: "Máj je vrcholem českého romantismu s bohatou obrazností, zvukomalbou a kontrasty." },
            { q: "Karel Havlíček Borovský zemřel v roce:", options: ["1848.", "1856.", "1860.", "1881."], a: 1, exp: "Borovský zemřel v roce 1856, krátce po návratu z Brixenu." },
            { q: "Satira 'Král Lávra' kritizuje:", options: ["Církev.", "Tupost a omezenost panovníka.", "Chudobu venkova.", "Německou kolonizaci."], a: 1, exp: "Král Lávra alegoricky kritizuje tupost a omezenost absolutistické moci." },
            { q: "Antonín Jaroslav Puchmajer byl:", options: ["Zakladatelem první novočeské básnické školy.", "Husitským knězem.", "Básníkem realismu.", "Představitelem Lumírovců."], a: 0, exp: "Puchmajer zakládal první novočeské básnické školy a almanachy." },
            { q: "Václav Thám působil v:", options: ["Národním divadle.", "Divadle Bouda.", "Divadle na Vinohradech.", "Stavovském divadle."], a: 1, exp: "Thám byl spjat s vlasteneckým divadlem Bouda." },
            { q: "Eliška Krásnohorská byla:", options: ["Zakladatelka gymnázia Minerva.", "Manželka Jana Nerudy.", "Autorka Kytice.", "Slovenská spisovatelka."], a: 0, exp: "Eliška Krásnohorská založila první dívčí gymnázium Minerva." },
            { q: "Matěj Milota Zdirad Polák napsal:", options: ["Vznešenost přírody.", "Záhořovo lože.", "Krále Lávru.", "Svatováclavskou mši."], a: 0, exp: "Polák napsal ódu Vznešenost přírody." },
            { q: "Karel Hynek Mácha byl členem:", options: ["Spolku Ruch.", "Stavovského divadla (jako ochotník).", "Akademie věd.", "Husitské sekty."], a: 1, exp: "Mácha byl ochotníkem ve Stavovském a Kajetánském divadle." },
            { q: "Jaký verš využíval Václav Stach?", options: ["Časoměrný.", "Volný.", "Rýmovaný.", "Moderní."], a: 0, exp: "Václav Stach byl zastáncem časoměrné prozodie." },

            // Májovci, Ruchovci, Lumírovci (10 otázek)
            { q: "Která generace se snažila povznést českou literaturu na světovou úroveň?", options: ["Májovci.", "Ruchovci.", "Lumírovci.", "Realisté."], a: 2, exp: "Lumírovci (Škola kosmopolitní) se orientovali na světovou literaturu." },
            { q: "Kdo byl představitelem Ruchovců?", options: ["Jaroslav Vrchlický.", "Svatopluk Čech.", "Jan Neruda.", "Julius Zeyer."], a: 1, exp: "Svatopluk Čech byl čelný představitel Ruchovců." },
            { q: "Jak se nazývá epos Svatopluka Čecha o sociální kritice?", options: ["Lešetínský kovář.", "Adamité.", "Husita na Baltu.", "Hanuman."], a: 0, exp: "Lešetínský kovář kritizuje sociální poměry a německý útlak." },
            { q: "Co je hlavním znakem realismu?", options: ["Nadpřirozené bytosti.", "Objektivní zobrazení reality.", "Únik do historie.", "Snové vize."], a: 1, exp: "Realismus usiluje o objektivní, pravdivé zobrazení reality." },
            { q: "Zikmund Winter psal o:", options: ["Venkovské přírodě.", "Rudolfinské Praze.", "Slovanské mytologii.", "Budoucnosti lidstva."], a: 1, exp: "Winter se specializoval na historii měst, řemesel a rudolfinské Prahy." },
            { q: "Román 'Děti čistého nebe' je dílem:", options: ["Karoliny Světlé.", "Terézy Novákové.", "Elišky Krásnohorské.", "Josefa Holečka."], a: 1, exp: "Teréza Nováková napsala Děti čistého nebe." },
            { q: "Jaký je hlavní znak tvorby Antala Staška?", options: ["Psychologie dělnického hnutí.", "Romantické popisy přírody.", "Náboženské legendy.", "Satirické epigramy."], a: 0, exp: "Stašek se věnoval sociálním tématům a dělnickému hnutí (např. Matouš a jeho přátelé)." },
            { q: "Klostermannova Šumava je:", options: ["Idylický ráj.", "Místo krvavých bitev.", "Drsné prostředí dřevorubců.", "Místo odpočinku šlechty."], a: 2, exp: "Klostermann líčil drsný, skutečný život šumavských lidí." },
            { q: "Jindřich Šimon Baar psal o:", options: ["Pražských měšťanech.", "Chodsku.", "Ostravsku.", "Slovácku."], a: 1, exp: "Baar byl chodský rodák a psal o životě na Chodsku." },
            { q: "Jan Herben psal o:", options: ["Slovácku.", "Šumavě.", "Krkonoších.", "Praze."], a: 0, exp: "Herbenova kronika Do třetího a čtvrtého pokolení zachycuje život na Slovácku." }
        ];

        let score = 0;
        let answeredQuestions = 0;

        const container = document.getElementById('quiz-container');

        otazky.forEach((otazka, index) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `q-card-${index}`;
            const title = document.createElement('div');
            title.className = 'question-title';
            title.textContent = `${index + 1}. ${otazka.q}`;
            card.appendChild(title);

            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'options';

            otazka.options.forEach((opt, optIndex) => {
                const label = document.createElement('label');
                const radio = document.createElement('input');
                radio.type = 'radio'; radio.name = `q${index}`; radio.value = optIndex;
                radio.addEventListener('change', function() {
                    const currentCard = document.getElementById(`q-card-${index}`);
                    const allRadios = currentCard.querySelectorAll('input[type="radio"]');
                    const labels = currentCard.querySelectorAll('label');
                    const expDiv = document.getElementById(`exp${index}`);
                    
                    allRadios.forEach(r => r.disabled = true);
                    currentCard.classList.add('locked');
                    const selectedVal = parseInt(this.value); const correctVal = otazky[index].a;
                    labels[correctVal].classList.add('correct');
                    if (selectedVal === correctVal) {
                        score++; expDiv.className = 'explanation success';
                        expDiv.innerHTML = `<strong>Správně!</strong><br><strong>Zdůvodnění:</strong> ${otazky[index].exp}`;
                    } else {
                        labels[selectedVal].classList.add('incorrect'); expDiv.className = 'explanation error';
                        expDiv.innerHTML = `<strong>Špatně.</strong><br><strong>Správná odpověď:</strong> <em>${otazky[index].options[correctVal]}</em><br><strong>Zdůvodnění:</strong> ${otazky[index].exp}`;
                    }
                    expDiv.style.display = 'block'; answeredQuestions++;
                });
                label.appendChild(radio); label.appendChild(document.createTextNode(opt)); optionsDiv.appendChild(label);
            });
            card.appendChild(optionsDiv);
            const explanationDiv = document.createElement('div');
            explanationDiv.className = 'explanation'; explanationDiv.id = `exp${index}`;
            card.appendChild(explanationDiv); container.appendChild(card);
        });

        function zobrazitKonecneSkore() {
            const resultDiv = document.getElementById('result');
            const percent = Math.round((score / otazky.length) * 100);
            resultDiv.innerHTML = `Váš konečný výsledek: ${score} z ${otazky.length} bodů (${percent} %).`;
            if(percent >= 80) resultDiv.style.color = '#27ae60';
            else if (percent >= 50) resultDiv.style.color = '#f39c12';
            else resultDiv.style.color = '#c0392b';
        }
    </script>
</body>
</html>
