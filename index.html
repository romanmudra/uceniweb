<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Státnicový test: Literární historie a divadlo (60 otázek)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .question-card {
            background: #fff;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-left: 5px solid #3498db;
        }
        .question-title {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 15px;
        }
        .options label {
            display: block;
            background: #f9f9f9;
            padding: 10px 15px;
            margin-bottom: 8px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #e0e0e0;
        }
        .options label:hover {
            background: #eef2f5;
        }
        input[type="radio"] {
            margin-right: 10px;
        }
        button {
            display: block;
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 30px;
            margin-bottom: 50px;
        }
        button:hover {
            background-color: #219653;
        }
        .correct {
            background-color: #d4edda !important;
            border-color: #c3e6cb !important;
            color: #155724;
            font-weight: bold;
        }
        .incorrect {
            background-color: #f8d7da !important;
            border-color: #f5c6cb !important;
            color: #721c24;
        }
        #result {
            font-size: 1.5em;
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <h1>Státnicový test z ČJ: Historie, autoři a divadla</h1>
    <p style="text-align:center;">Vyberte u každé otázky jednu správnou odpověď. Test vychází výhradně z vašich poznámek.</p>
    
    <div id="quiz-container"></div>
    
    <button onclick="vyhodnotitTest()">Vyhodnotit test</button>
    <div id="result"></div>

    <script>
        const otazky = [
            // Václav Havel
            { q: "Z jaké rodiny pocházel Václav Havel?", options: ["Z dělnické rodiny z Kladna", "Z pražské podnikatelské rodiny", "Z učitelské rodiny z Brna", "Ze zemědělské rodiny z Moravy"], a: 1 },
            { q: "Kterou čtvrť vybudoval Havlův dědeček a otec (spolu s palácem Lucerna)?", options: ["Vinohrady", "Žižkov", "Barrandov", "Dejvice"], a: 2 },
            { q: "Z jakého důvodu byl V. Havel v roce 1950 vyloučen z poděbradského gymnázia?", options: ["Pro špatný prospěch", "Z politických důvodů", "Kvůli emigraci", "Z rodinných důvodů"], a: 1 },
            { q: "Jakou profesi vykonával V. Havel po vyloučení ze školy?", options: ["Chemický laborant na VŠCHT", "Knihovník", "Kulisák v Národním divadle", "Učitel na základní škole"], a: 0 },
            { q: "Jak se jmenovalo sdružení, které Havel založil a které vydávalo časopis Rozhovory 36?", options: ["Osmačtyřicátníci", "Šestatřicátníci", "Chartisté", "Kruh nezávislých spisovatelů"], a: 1 },
            { q: "Kde pracoval Havel po vojenské službě jako jevištní technik?", options: ["V Národním divadle", "V Divadle na Vinohradech", "V Divadle ABC", "Ve Studiu Y"], a: 2 },
            { q: "Kde působil V. Havel jako dramaturg po svém působení v Divadle ABC?", options: ["V Divadle Na zábradlí", "V Činoherním klubu", "V Redutě", "V Semaforu"], a: 0 },
            { q: "Co V. Havel oficiálně vystudoval?", options: ["Práva na UK", "Filozofii na UK", "Dramaturgii na DAMU", "Režii na FAMU"], a: 2 },
            { q: "V jakém roce založil V. Havel samizdatovou Edici Expedice?", options: ["1968", "1975", "1977", "1989"], a: 1 },
            { q: "K jakému trestu byl Havel odsouzen za spoluzaložení Charty 77 (v roce 1977)?", options: ["K vyhoštění ze země", "K 14 měsícům vězení", "K 4,5 roku vězení", "K domácímu vězení"], a: 1 },
            { q: "K jakému trestu byl odsouzen v roce 1978 za spoluzaložení VONS za podvracení republiky?", options: ["K 14 měsícům", "Ke 2 letům", "K 4,5 roku", "K 10 letům"], a: 2 },
            { q: "Kterého dne byl Václav Havel zvolen prezidentem Československé federativní republiky?", options: ["17. 11. 1989", "25. 12. 1989", "1. 1. 1993", "21. 8. 1968"], a: 1 },
            { q: "Které z následujících děl je dramatem Václava Havla?", options: ["Balada pro banditu", "Konec masopustu", "Zahradní slavnost", "Král Vávra"], a: 2 },
            { q: "Které z následujících děl PATŘÍ mezi eseje Václava Havla?", options: ["Asanace", "Dopisy Olze", "Protest", "Vernisáž"], a: 1 },
            
            // Audience
            { q: "Do jakého žánru spadá Havlova hra Audience?", options: ["Historické drama", "Absurdní drama", "Komedie dell'arte", "Tragédie"], a: 1 },
            { q: "V jakém roce vznikla hra Audience?", options: ["1965", "1968", "1975", "1989"], a: 2 },
            { q: "Komu je hra Audience věnována (památce koho)?", options: ["Janu Patočkovi", "Alfrédu Radokovi", "Jiřímu Šlitrovi", "Ladislavu Fialkovi"], a: 1 },
            { q: "Jak je charakterizován Ferdinand Vaněk ve hře Audience?", options: ["Vulgární a výmluvný", "Tichý, pracovitý, vystudovaný ekonom", "Žoviální a pijící pivo", "Původně hrobař"], a: 1 },
            { q: "Jaké povolání dříve vykonávala postava Bureše v Audienci?", options: ["Ekonom", "Spisovatel", "Skladník", "Hrobař"], a: 3 },
            { q: "Kterou herečku navrhoval Sládek pozvat do pivovaru (byla by s ní „sranda“)?", options: ["Ivu Janžurovou", "Jiřinu Bohdalovou", "Ninu Divíškovou", "Jitku Molavcovou"], a: 1 },
            { q: "Z jakého města byl Vaněk údajně přesunut do současného pivovaru?", options: ["Z Prahy", "Z Plzně", "Z Brna", "Z Pardubic"], a: 3 },
            { q: "Před stýkáním se s kým Sládek Vaňka výslovně varuje?", options: ["S Pavlem Kohoutem", "S Karlem Gottem", "S Jiřím Suchým", "S Milanem Uhdem"], a: 0 },
            { q: "Jak reaguje Vaněk v úplně závěrečné scéně na zdvořilou otázku Sládka?", options: ["Odmítne odpovědět", "Rozpláče se", "Odpovídá vulgárně („Na hovno“)", "Nabídne mu pivo"], a: 2 },

            // Divadlo 70. - 80. let (Autoři)
            { q: "Jaké obory vystudoval Ivan Vyskočil?", options: ["Práva a ekonomii", "DAMU a pedagogiku-psychologii na UK", "Chemii na VŠCHT", "Filozofii a historii"], a: 1 },
            { q: "Která divadla zakládal Ivan Vyskočil?", options: ["Semafor a Studio Y", "Redutu a Na zábradlí", "Činoherní klub a Divadlo za branou", "Husu na provázku a Divadlo na Vinohradech"], a: 1 },
            { q: "Kterou z těchto her napsal Ivan Vyskočil?", options: ["Kdyby tisíc klarinetů", "Kočka na kolejích", "Král Vávra", "Piknik"], a: 0 },
            { q: "Kde působil Josef Topol před studiem DAMU?", options: ["V Národním divadle", "V Divadle E. F. Buriana", "V Divadle ABC", "Ve Studiu Y"], a: 1 },
            { q: "Které drama Josefa Topola bylo inspirováno Kosmovou kronikou a luckou válkou?", options: ["Konec masopustu", "Půlnoční vítr", "Kočka na kolejích", "Dávno, dávno již tomu"], a: 1 },
            { q: "Z jakého původu pocházel dramatik Milan Uhde?", options: ["Ze šlechtického", "Z židovského po matce", "Z dělnického z Ostravy", "Z německého"], a: 1 },
            { q: "Do jakého časopisu přispíval Milan Uhde?", options: ["Rozhovory 36", "Host do domu", "Respekt", "Květy"], a: 1 },
            { q: "Které z těchto děl je od Milana Uhdeho?", options: ["Král Vávra", "Piknik", "Marast", "Jiné komedie"], a: 0 },
            { q: "Čí knižní předlohu (Nikola Šuhaj loupežník) adaptoval Uhde v Baladě pro banditu?", options: ["Bohumila Hrabala", "Ivana Olbrachta", "Vladislava Vančury", "Karla Čapka"], a: 1 },
            { q: "Kdo je autorem her Marast a Ecce Constantia?", options: ["Pavel Kohout", "Pavel Landovský", "Jiří Dienstbier", "František Pavlíček"], a: 0 },
            { q: "Kdo je autorem her Jiné komedie a Sanitární noc?", options: ["Josef Topol", "Pavel Landovský", "Ivan Vyskočil", "Jiří Dienstbier"], a: 1 },
            { q: "Kdo je autorem hry Příjem?", options: ["Pavel Kohout", "Pavel Landovský", "Jiří Dienstbier", "Václav Havel"], a: 2 },
            { q: "Kdo je autorem díla Dávno, dávno již tomu?", options: ["František Pavlíček", "Milan Uhde", "Josef Topol", "Jan Schmid"], a: 0 },

            // Divadla
            { q: "Co tvořil Ladislav Fialka v Divadle Na zábradlí?", options: ["Absurdní dramata", "Pantomimické scénky", "Text-appealy", "Muzikály"], a: 1 },
            { q: "V kterém městě a roce bylo původně založeno Studio Y?", options: ["V Brně 1968", "V Liberci 1963", "V Praze 1978", "V Ostravě 1965"], a: 1 },
            { q: "Kdo byl zakladatelem a ředitelem Studia Y?", options: ["Jan Schmid", "Otomar Krejča", "Jaroslav Vostrý", "Ladislav Smoček"], a: 0 },
            { q: "Jaký dramatický formát byl typický pro Studio Y (kolektivní improvizace)?", options: ["Text-appealy", "Takzvaný večer na přidanou", "Vědecké přednášky", "Absurdní tlachání"], a: 1 },
            { q: "Kdo založil Divadlo za branou (existující 1965-1972)?", options: ["Ivan Vyskočil", "Otomar Krejča", "Jan Schmid", "Jiří Suchý"], a: 1 },
            { q: "Které divadlo zakládali v roce 1965 Jaroslav Vostrý a Ladislav Smoček?", options: ["Divadlo za branou", "Činoherní klub", "Husa na provázku", "Studio Y"], a: 1 },
            { q: "Jak se jmenovala první hra L. Smočka v Činoherním klubu?", options: ["Kočka na kolejích", "Kdyby tisíc klarinetů", "Piknik", "Král Vávra"], a: 2 },
            { q: "Které divadlo vedl ředitel Pistorius a působily v něm herečky Janžurová a Bohdalová?", options: ["Divadlo Na zábradlí", "Divadlo na Vinohradech", "Semafor", "Reduta"], a: 1 },
            { q: "Pro které divadlo jsou typické vědecké přednášky a parodování českých vlastností?", options: ["Divadlo Járy Cimrmana", "Činoherní klub", "Husa na provázku", "Divadlo na okraji"], a: 0 },
            { q: "Podle čeho získalo název divadlo Husa na provázku?", options: ["Podle básně J. Suchého", "Podle Mahenovy knížky filmových libret", "Byl to akronym", "Podle rekvizity v Baladě pro banditu"], a: 1 },

            // Divadla malých forem (60. léta)
            { q: "Kde vznikla první malá jeviště a jaký byl jejich cíl?", options: ["Jako státní divadla na podporu režimu", "Z iniciativy skupinek nadšenců po kritice kultu osobnosti na 20. sjezdu KSSS", "Jako výhradně loutková divadla pro děti", "Jako součást Národního divadla"], a: 1 },
            { q: "V jakém roce byla otevřena Reduta?", options: ["1950", "1957", "1965", "1968"], a: 1 },
            { q: "Co byly tzv. text-appealy využívané v Redutě?", options: ["Němé pantomimické výstupy", "Snaha zapůsobit textem hraným, vypravovaným a zpívaným", "Manifesty proti cenzuře", "Akronymy hudebních žánrů"], a: 1 },
            { q: "Kdo založil divadlo Semafor v roce 1959?", options: ["Vyskočil a Vodička", "Suchý a Šlitr", "Vostrý a Smoček", "Smoljak a Svěrák"], a: 1 },
            { q: "Co znamená název akronymu SEMAFOR?", options: ["Sedm malých forem", "Sdružení emancipačních forem", "Sekce mladých formátů", "Sdružení malířů a fotografů"], a: 0 },
            { q: "Jak se jmenovala první hra divadla Semafor?", options: ["Zuzana je sama doma", "Člověk z půdy", "Jonáš a tingltangl", "Kytice"], a: 1 },
            { q: "Jaké proslavené kabaretní pásmo z roku 1962 účinkovali Šlitr a Suchý?", options: ["Zuzana není pro nikoho doma", "Kdyby tisíc klarinetů", "Jonáš a tingltangl", "Tak co, pane barone"], a: 2 },
            { q: "Kdo tvořil autorskou dvojici Grossmann a... (konec 60. let)?", options: ["Svěrák", "Šlitr", "Šimek", "Dvořák"], a: 2 },
            { q: "Kdo byli zakladatelé Divadla Na zábradlí (1958)?", options: ["Suchý, Šlitr", "Vyskočil, Suchý, Vodička", "Krejča, Topol", "Vostrý, Smoček"], a: 1 },
            { q: "Která hra s písničkami byla prvním představením Divadla Na zábradlí?", options: ["Člověk z půdy", "Kdyby tisíc klarinetů", "Piknik", "Zahradní slavnost"], a: 1 }
        ];

        const container = document.getElementById('quiz-container');

        // Generování HTML pro otázky
        otazky.forEach((otazka, index) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            
            const title = document.createElement('div');
            title.className = 'question-title';
            title.textContent = `${index + 1}. ${otazka.q}`;
            card.appendChild(title);

            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'options';

            otazka.options.forEach((opt, optIndex) => {
                const label = document.createElement('label');
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = `q${index}`;
                radio.value = optIndex;
                
                label.appendChild(radio);
                label.appendChild(document.createTextNode(opt));
                optionsDiv.appendChild(label);
            });

            card.appendChild(optionsDiv);
            container.appendChild(card);
        });

        // Vyhodnocovací logika
        function vyhodnotitTest() {
            let score = 0;
            const cards = document.querySelectorAll('.question-card');

            cards.forEach((card, index) => {
                const selected = card.querySelector(`input[name="q${index}"]:checked`);
                const labels = card.querySelectorAll('label');
                
                // Reset stylů
                labels.forEach(l => {
                    l.classList.remove('correct');
                    l.classList.remove('incorrect');
                });

                if (selected) {
                    const ans = parseInt(selected.value);
                    if (ans === otazky[index].a) {
                        score++;
                        selected.parentElement.classList.add('correct');
                    } else {
                        selected.parentElement.classList.add('incorrect');
                        labels[otazky[index].a].classList.add('correct');
                    }
                } else {
                    // Pokud nic nevybral, jen ukaž správnou
                    labels[otazky[index].a].classList.add('correct');
                }
            });

            const resultDiv = document.getElementById('result');
            const percent = Math.round((score / otazky.length) * 100);
            resultDiv.innerHTML = `Váš výsledek: ${score} z ${otazky.length} bodů (${percent} %).`;
            
            if(percent >= 80) {
                resultDiv.style.color = '#27ae60';
                resultDiv.innerHTML += "<br>Skvělá práce, státnice máte v kapse!";
            } else if (percent >= 50) {
                resultDiv.style.color = '#f39c12';
                resultDiv.innerHTML += "<br>Dobrý základ, ale historii je třeba ještě trochu procvičit.";
            } else {
                resultDiv.style.color = '#c0392b';
                resultDiv.innerHTML += "<br>Tohle bude chtít ještě projít poznámky. Nevzdávejte to!";
            }
        }
    </script>
</body>
</html>
