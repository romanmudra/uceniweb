    <h1>Státnicový test z ČJ (Otázka 9)</h1>
    <div class="subtitle">Didaktika žánrů, Starší česká literatura, Kroniky a Legendy (vč. detailů Kristiánovy legendy)<br><strong>Vyberte odpověď – výsledek a zdůvodnění se zobrazí okamžitě.</strong></div>
    
    <div id="quiz-container"></div>
    
    <button onclick="zobrazitKonecneSkore()">Zobrazit celkové skóre</button>
    <div id="result"></div>

    <script>
        const otazky = [
            // Didaktika
            { q: "Jaký je primární rozdíl mezi tzv. tradičním a kreativním didaktickým postupem při práci s literárním žánrem (např. s bajkou)?", options: [
                "Zatímco kreativní postup vyžaduje, aby učitel na začátku hodiny nadiktoval přesnou literárněvědnou definici, kterou žáci musí obhájit, tradiční postup nechává žáky, aby si celou bajku vymysleli a napsali sami od nuly bez jakýchkoliv pravidel.", 
                "Tradiční postup žákovi rovnou ozřejmí znaky žánru a následně je v úryvku jen mechanicky hledá (což nezaručuje komunikativnost), zatímco při kreativním postupu učitel žánr záměrně zatají a nechá žáky, aby formou vlastního logického objevování znaky žánru sami vyvodili.", 
                "Při tradičním postupu učitel využívá výhradně audiovizuální pomůcky a historické kontexty k určení žánru, naproti tomu kreativní přístup spočívá v tom, že žáci text vůbec nečtou, ale pouze hádají děj na základě divadelní improvizace před třídou.", 
                "Tradiční pojetí klade důraz na to, aby žák bezchybně zařadil autora do příslušného literárního slohu a století, kdežto kreativní pojetí se soustředí pouze na recitaci a intonaci, přičemž jakékoliv zkoumání samotných rysů bajky je zcela opomíjeno."
            ], a: 1, exp: "Tradiční postup (ozřejmení znaků -> hledání v textu) je neozvláštňující a nekreativní. Při kreativním postupu učitel ponechá v tajnosti, o jaký žánr se jedná, a nechá děti, aby na základě práce s textem kreativní formou samy získaly povědomí o znacích daného žánru." },
            { q: "V čem spočívá didaktická 'metoda čtení s předvídáním' (ilustrovaná na bajce Spící had) a jaká je role žáka v tomto procesu?", options: [
                "Žák je veden k tomu, aby na základě dostupných informací v textu logicky usuzoval a formuloval předpoklady o dalším vývoji děje, přičemž svá tvrzení musí umět odůvodnit a v průběhu četby své původní významy neustále opravuje a zpřesňuje.", 
                "Učitel před samotným čtením prozradí žákům kompletní pointu a závěr příběhu, aby se studenti zbavili napětí z neznámého a mohli se během následné četby plně a nerušeně soustředit výhradně na detailní gramatický a syntaktický rozbor složitých souvětí.", 
                "Tato metoda spočívá v tom, že žáci text vůbec nečtou od začátku, ale začnou číst rovnou od poslední kapitoly směrem k první, čímž se rozvíjí jejich schopnost dedukce a zpětného hledání kauzálních vazeb, i když je tím narušen emocionální prožitek.", 
                "Jde o klasický frontální postup, kdy učitel žákům nadiktuje přesnou literárněhistorickou definici daného žánru a žáci následně v textu pouze mechanicky a pasivně vyhledávají konkrétní příklady, které tuto předem stanovenou pevnou teoretickou definici potvrzují."
            ], a: 0, exp: "Metoda čtení s předvídáním není pouhé hádání, ale logické usuzování na další pokračování textu podložené čtenářskými zkušenostmi. Žák odůvodňuje svá tvrzení, čte aktivně po částech, ptá se, zda bylo jeho očekávání splněno, a případně opravuje původní významy." },
            { q: "Co je hlavním charakteristickým znakem tzv. 'chronologického uspořádání učiva' v literární výchově a pro jakou cílovou skupinu se primárně uplatňuje?", options: [
                "Jeho největším přínosem je absolutní dodržování didaktického principu od jednoduchého ke složitému, protože starověké a středověké texty jsou pro dnešní mladší žáky jazykově mnohem srozumitelnější než moderní literatura, a proto se využívá převážně na prvním stupni ZŠ.", 
                "Vyznačuje se tím, že učitel v hodinách zcela záměrně a nahodile přeskakuje mezi různými literárními epochami a kulturami, aby žáky neustále udržoval v napětí a podněcoval jejich vizuální paměť; je určeno primárně pro žáky se speciálními vzdělávacími potřebami.", 
                "Mezi jeho klady patří lehkost utřídění a pochopení logické umělecké i historické návaznosti, avšak hrozí u něj automatizace výuky a neodpovídá vždy přirozeným čtenářským potřebám vzhledem k věku; upřednostňuje se převážně ve vyšších ročnících.", 
                "Toto uspořádání zcela opomíjí dějinné souvislosti a dějiny národů, jelikož primárně dělí literaturu do tematických bloků (např. láska, válka, příroda), a je proto naprosto ideální pro výuku na středních odborných školách technického zaměření."
            ], a: 2, exp: "Chronologické uspořádání učiva se upřednostňuje ve vyšších ročnících. Kladem je lehkost utřídění, logická a historická návaznost a uvedení do národní tradice. Záporem je narušení principu 'od jednoduchého ke složitému' (staré texty jsou pro žáky těžké), neadekvátnost k věku a hrozba automatizace výuky." },
            { q: "Jak se v didaktické praxi projevuje metoda 'žánrové transformace'?", options: [
                "Žáci jsou nuceni přepisovat všechny staré veršované texty výhradně do podoby moderního volného verše, aby se tak uměle a radikálně smazaly veškeré historické jazykové rozdíly a přiblížila se klasická poezie současným hovorovým standardům mládeže.", 
                "Učitel seznámí žáky s tím, jak se vyvíjí a proměňuje určitá látka či konkrétní literární žánr v čase; například jak se ze středověké hagiografické legendy postupně stává moderní biografický román (např. o Františku Hrubínovi) sledující osudy významných osobností.", 
                "Je to výhradně divadelní technika, kdy se původně prozaický text dramatizuje pro školní představení, přičemž se však úzkostlivě a přísně dbá na to, aby ani jedno jediné slovo z původní historické předlohy nebylo za žádných okolností změněno nebo vynecháno.", 
                "Označuje se tak specifická situace, kdy spisovatel zcela omylem a nevědomky napíše dílo v jiném žánru, než původně zamýšlel, a úkolem bystrých žáků je tento autorský omyl analyticky odhalit a text červenou propiskou opravit do čisté a teoreticky správné žánrové podoby."
            ], a: 1, exp: "Metoda žánrové transformace seznamuje žáky s vývojem a transformací jednotlivých žánrů v čase. Příkladem je přeměna středověké legendy na biografický román (Hrabal) nebo vývoj pohádek od neintencionálních k intencionálním." },

            // Forma legendy
            { q: "Středověká legenda má svou ustálenou literární a kompoziční formu. Které čtyři základní části v přesném pořadí tvoří klasickou hagiografickou strukturu legendy?", options: [
                "1. nativitas (narození a proroctví), 2. peregrinatio (cesta na svatá místa), 3. confessio (vyznání víry před soudem), 4. martyrium (bolestivá smrt na kříži).", 
                "1. vita (život světce), 2. passio (utrpení světce a jeho smrt), 3. translatio (přenesení ostatků světce a zajímavosti o něm), 4. miracula (zázraky spojené se světcem).", 
                "1. prologus (poděkování mecenáši), 2. doctrina (teologické poučení lidu), 3. bellum (obrana křesťanství mečem), 4. apotheosis (nanebevstoupení za doprovodu andělů).", 
                "1. origo (původ a vznešený rod), 2. tentatio (pokušení od ďábla na poušti), 3. miracula (zázraky vykonané za života), 4. damnatio (proklínání a vyhnání nepřátel církve)."
            ], a: 1, exp: "Zápisky jasně definují ustálenou formu legendy v těchto čtyřech bodech: 1. vita (život světce), 2. passio (utrpení světce, smrt), 3. translatio (přenesení ostatků), 4. miracula (zázrak)." },

            // Velká Morava a Cyril s Metodějem
            { q: "Za jakým účelem a z jakého důvodu vyslal velkomoravský panovník Rastislav v roce 862 poselstvo k byzantskému císaři Michalu III.?", options: [
                "Chtěl uzavřít vojenskou a strategickou alianci proti rozpínající se Franské říši a zároveň požádal o dodání byzantských zbraní a obléhacích strojů pro zabezpečení nově postavených moravských hradišť.", 
                "Žádal o vyslání vzdělaných biskupů a kněží, kteří by na Moravě zavedli výhradně latinskou liturgii, čímž chtěl politicky izolovat a oslabit vliv nedalekého německého pasovského a řezenského biskupství.", 
                "Byl zděšen z rozvrácených poměrů na Moravě a prosil o vyslání křesťanských věrozvěstů, kteří by kázali a šířili víru ve srozumitelné slovanské řeči, čímž by se Morava vymanila z vlivu franských kněží.", 
                "Snažil se domluvit dynastický sňatek svého syna Svatopluka s byzantskou princeznou, aby tímto krokem pozvedl prestiž Velké Moravy na úroveň tehdejších nejmocnějších středověkých evropských říší."
            ], a: 2, exp: "Rastislav vyslal poselstvo (862), protože byl zděšen z poměrů na Moravě, a prosil o osobu, která by kázala ve slovanské řeči. Chtěl tím omezit vliv franských (německých) kněží, kteří kázali latinsky." },
            { q: "Jaký osud potkal Metoděje během jeho snahy o vybudování nezávislé panonsko-moravské církevní provincie a jaký byl jeho vztah k franckým kněžím?", options: [
                "Byl franckými biskupy s nadšením přijat a okamžitě jmenován hlavním papežským poradcem pro východní Evropu; se svým nejbližším přítelem, nitranským biskupem Wichingem, pak úspěšně potlačil veškeré pohanské vzpoury.", 
                "Po smrti Konstantina byl jmenován moravským arcibiskupem, avšak během cesty z Říma byl ze msty zajat nenávistnými Franky a vězněn. Po propuštění čelil obvinění z kacířství a musel neustále bojovat s intrikami nitranského biskupa Wichinga.", 
                "Metoděj po bratrově smrti rezignoval na šíření slovanštiny, dobrovolně se podrobil bavorským biskupům, opustil Moravu a zbytek života strávil v tichém ústraní v tichém a opuštěném klášteře na hoře Athos.", 
                "Stal se vůdcem mohutného ozbrojeného povstání proti francké okupaci, vedl spojená moravská vojska do vítězné bitvy u Velehradu, avšak nedlouho poté ho Svatopluk ze žárlivosti nechal tajně otrávit jedem."
            ], a: 1, exp: "Metoděj byl v roce 869 jmenován moravským arcibiskupem. Během cesty z Říma byl zajat Franky, vězněn a sesazen (propuštěn až na zásah papeže Jana VIII.). Čelil obviněním z kacířství a trvalým intrikám nitranského biskupa Wichinga." },
            { q: "Co je to 'Proglas' a jaký je jeho stěžejní literární a kulturní význam pro staroslověnskou vzdělanost?", options: [
                "Jedná se o podrobnou sbírku středověkých církevních a civilních právních předpisů a zákonů, kterou sepsal Metoděj pro knížete Svatopluka, aby na Velké Moravě nastolil pevný politický a právní řád nezávislý na Římě.", 
                "Je to vůbec první staroslověnská veršovaná předmluva k evangeliu, jejímž autorem je s největší pravděpodobností Konstantin. Dílo plamenně a s hlubokým přesvědčením obhajuje základní právo každého národa i člověka na bohoslužby v mateřském, srozumitelném jazyce.", 
                "Jde o krátký, latinsky psaný hagiografický záznam o životě a umučení svaté Ludmily, který byl z taktických důvodů uměle přeložen do staroslověnštiny, aby se zalíbil konzervativně smýšlejícímu lidovému obyvatelstvu přemyslovských Čech.", 
                "Představuje soubor veselých i vážných vyprávění o osamělých mniších a poustevnících, kteří žili v drsných podmínkách egyptské pouště, a jehož úkolem bylo poskytnout nově pokřtěným Moravanům poutavé a morální čtení na dlouhé zimní večery."
            ], a: 1, exp: "Proglas je veršovaná předmluva k evangeliu, jejímž autorem je Konstantin. Významně a silně hájí právo člověka na bohoslužby a poslech slova Božího v mateřském jazyce." },
            { q: "Jaké literární specifikum činí z tzv. 'Kyjevských listů' naprosto výjimečnou a nenahraditelnou staroslověnskou literární památku?", options: [
                "Jedná se o vůbec nejdelší dochovaný epický básnický text o rozsahu čtyř tisíc veršů, který detailně, a hlavně v češtině popisuje hrdinské bitvy moravských knížat s mocnými franckými vojsky u řeky Dunaje.", 
                "Je to jediný staroslověnský rukopis, který se fyzicky dochoval přímo z původního staroslověnského období velkomoravské říše; tvoří jej zlomek 7 pergamenových listů mešní knihy a je napsán původním písmem – hlaholicí.", 
                "Tento text je naprosto unikátní tím, že jako jediný dokument z 9. století otevřeně kritizuje a zpochybňuje samotného papeže, vyzývá k ozbrojené rebelii rolníků a obsahuje první dochované kletby v lidovém jazyce.", 
                "Představují soubor tajných diplomatických zpráv a šifrovaných kódů, které si mezi sebou vyměňovali Konstantin s byzantským císařem; jsou psány speciální zjednodušenou latinkou, aby je franská rozvědka nedokázala na hranicích rozluštit."
            ], a: 1, exp: "Kyjevské listy jsou jediným dochovaným rukopisem z období staroslověnského (psány hlaholicí, zlomek 7 pergamenových listů mešní knihy). Všechny ostatní památky se dochovaly až v pozdějších opisech z 10. nebo 11. století." },

            // Legendy 10.-11. století (sv. Václav)
            { q: "Čím se vyznačuje tzv. '1. staroslověnská legenda o sv. Václavovi' a jakým specifickým způsobem přistupuje k samotné historické osobnosti tohoto zavražděného knížete?", options: [
                "Vyznačuje se nesmírně složitým a květnatým rétorickým stylem plným latinských příměrů; knížete Václava zobrazuje jako dokonalou, od narození zcela bezhříšnou a svatou božskou bytost obklopenou neustálými nadpřirozenými úkazy a množstvím ohromujících zázraků.", 
                "Byla sepsána na popud německého císaře a účelově zatajuje jakékoliv konflikty s Boleslavem; Václava naopak líčí jako fanatického a agresivního vojevůdce, který nutil pohanské kmeny ke křtu ohněm a mečem a zavedl na našem území obávanou inkvizici.", 
                "Jedná se o velmi prostou a věcnou zprávu, pravděpodobně sepsanou přímým očitým svědkem vraždy (snad knězem slovanského obřadu). Záměrně postrádá typické hagiografické zázračné prvky a Václava ukazuje především jako obyčejného, chybujícího člověka, kterému se stalo strašlivé neštěstí.", 
                "Jde o rozsáhlý veršovaný a rýmovaný epos z 12. století, ve kterém je osobnost svatého Václava stylizována do role bájného a neporazitelného antického hrdiny Herkula, bojujícího s bájnými stvůrami a draky bránícími přístup na Pražský hrad."
            ], a: 2, exp: "1. staroslověnská legenda je prostá, hagiografické prvky v ní scházejí a jedná se spíše o analistický dokument o převratné politické situaci. Václav je v ní podán jako obyčejný člověk, kterému se stalo neštěstí, nikoliv jako ikona opředená záplavou zázraků." },
            { q: "Proč vznikla latinsky psaná 'Gumpoldova legenda' a kdo dal přímý popud k jejímu sepsání ve třetině 10. století?", options: [
                "Byla sepsána na žádost samotného bratrovraha Boleslava I., který si najal italského biskupa, aby po Evropě rozšířil lživou zprávu o tom, že Václav spáchal sebevraždu a Boleslav je tak právoplatným a naprosto nevinným vládcem české země.", 
                "Sepsal ji mantovský biskup Gumpold na přímý popud tehdejšího císaře Oty II., přičemž samotná objednávka na zhotovení přepychového iluminovaného rukopisu (uloženého dnes ve Wolfenbüttelu) přišla od Emmy, manželky knížete Boleslava II.", 
                "Tato legenda vznikla spontánně a tajně mezi prostým venkovským českým lidem jako reakce na brutální vyvražďování Slavníkovců, přičemž Gumpold pouze sesbíral a přeložil do latiny lidové písně zpívané pražskými chudinami u vltavských brodů.",

            ], a: 2, exp: "Legenda o sv. Kateřině je výjimečná obrovským estetickým posunem k poezii a umění a vysoce kultivovanou formou veršů. Spojuje hluboce oddaný a truchlivý obsah (mučednictví čisté dcery kyperského krále Kateřiny, mystické svázání a sňatek s Kristem, kruté potupné mrskání a umučení od odmítnutého vládce Maxencia) s neuvěřitelně bravurním a na tu dobu výjimečným a vysokým veršovaným uměleckým řemeslem; s dokonalým básnickým rytmem, složitými promyšlenými a zvukomalebnými anaforami, aliteracemi (např. 'Zvěstujiť zlatý zázrak...') a častými přesahy ve verši. To vše jasně způsobilo, že historická a hrubá hodnota u ní zřetelně a značně ustupuje do pozadí právě na úkor oslavy dokonalé formy a vysoké vytříbené a dokonalé umělecké libozvučné básnické zvukové hodnoty slov pro čtenáře vysoké společnosti." },
            { q: "Česká středověká divadelní hra, veršovaná absurdní i zemitá fraška známá pod stručným názvem 'Mastičkář', patří k neobyčejným klenotům. Jaká oblíbená divadelní, komediální a lehce oplzlá i humorná stěžejní scéna tvoří překvapivý komediální zvrat u krámku se zázračnými mastmi na jarmarku plném kupců?", options: [
                "Podvodný židovský obchodník a pomocník Pustula za zády vznešeného a přísného středověkého lékárníka a ranhojiče, lékaře mistra Severina, s velkou drzostí smíchá posvátnou mešní krev s kočičím jedem a touto nebezpečnou, horkou a zakázanou tekutinou vzkřísí a zvedne mrtvou princeznu z márnice tím, že z hrnce a nádoby horký omamný jed prudce vychrstne zblízka dívce se smíchem do chladné tváře, načež jsou ale všichni ihned pochytáni inkvizicí za kacířství.", 
                "Mistr léčitel, bohatý a arogantní Mastičkář Severin se svou povedenou čeládkou z tržiště (poté co opěvují lektvary) pro pobavení drsně a velmi vulgárně potírají vonnou a údajně drahou kvasnicovou léčivou sprostou mastí oholenou část – konkrétně chlupatý a oteklý zadek odřený po jízdě i rány na končetinách jedné nebohé mrtvé paní (často v hrubé interpretaci hercem). Obyčejný pomocník s prořízlou pusou, Pustula neboli prostořeký zrzavý sprostý drsný a hubatý sluha Rubín mu s ironií vysmívá marnost a předstíranou poctivost.",

                "Vážný a hluboce náboženský dramatický ponurý liturgický napjatý posvátný děj se nečekaně zvrtne v hroznou vřavu a tragédii krve za jarmarku, když k mastičkářskému bohatému stánku u brány přijdou ve svém truchlení biblické svaté utrápené a tiché milující plačící vdovy a ctnostné tiché a čisté biblické Marie se svatými lahvičkami z chrámu a žádají od přítomných šokovaných kacířů nejlepší myrhu, poctivé byliny a drahé masti pro pomazání těla usmrceného a ubitého trpícího Spasitele z Nazaretu; šarlatánský bezcitný i ohavný posměvačný tržní felčar drsný starý Severin z lakoty a chamtivosti s nimi drsně smluví obchod a s křikem rovnou odmítne v nouzi chudým matkám s posměšky lék i úlevu vydat vůbec nebo zdarma."

        ];

        let score = 0;
        let answeredQuestions = 0;

        const container = document.getElementById('quiz-container');

        // Generování HTML a okamžité vyhodnocení
        otazky.forEach((otazka, index) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `q-card-${index}`;
            
            const title = document.createElement('div');
            title.className = 'question-title';
            title.textContent = `${index + 1}. ${otazka.q}`;
            card.appendChild(title);

            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'options';

            otazka.options.forEach((opt, optIndex) => {
                const label = document.createElement('label');
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = `q${index}`;
                radio.value = optIndex;
                
                radio.addEventListener('change', function() {
                    const currentCard = document.getElementById(`q-card-${index}`);
                    const allRadios = currentCard.querySelectorAll('input[type="radio"]');
                    const labels = currentCard.querySelectorAll('label');
                    const expDiv = document.getElementById(`exp${index}`);
                    
                    // Uzamknutí otázky
                    allRadios.forEach(r => r.disabled = true);
                    currentCard.classList.add('locked');

                    const selectedVal = parseInt(this.value);
                    const correctVal = otazky[index].a;

                    labels[correctVal].classList.add('correct');

                    if (selectedVal === correctVal) {
                        score++;
                        expDiv.className = 'explanation success';
                        expDiv.innerHTML = `<strong>Správně!</strong><br><strong>Zdůvodnění:</strong> ${otazky[index].exp}`;
                    } else {
                        labels[selectedVal].classList.add('incorrect');
                        expDiv.className = 'explanation error';
                        expDiv.innerHTML = `<strong>Špatně.</strong><br>
                                            <strong>Správná odpověď:</strong> <em>${otazky[index].options[correctVal]}</em><br>
                                            <strong>Zdůvodnění:</strong> ${otazky[index].exp}`;
                    }
                    expDiv.style.display = 'block';
                    answeredQuestions++;
                });

                label.appendChild(radio);
                label.appendChild(document.createTextNode(opt));
                optionsDiv.appendChild(label);
            });

            card.appendChild(optionsDiv);

            const explanationDiv = document.createElement('div');
            explanationDiv.className = 'explanation';
            explanationDiv.id = `exp${index}`;
            card.appendChild(explanationDiv);

            container.appendChild(card);
        });

        // Finální shrnutí na konci
        function zobrazitKonecneSkore() {
            const resultDiv = document.getElementById('result');
            
            if (answeredQuestions < otazky.length) {
                resultDiv.style.color = '#e67e22';
                resultDiv.innerHTML = `Zatím jste odpověděl/a na ${answeredQuestions} z ${otazky.length} otázek. <br> Průběžné skóre: ${score} správně.`;
                return;
            }

            const percent = Math.round((score / otazky.length) * 100);
            resultDiv.innerHTML = `Váš konečný výsledek: ${score} z ${otazky.length} bodů (${percent} %).`;
            
            if(percent >= 80) {
                resultDiv.style.color = '#27ae60';
                resultDiv.innerHTML += "<br>Úctyhodný výkon! I přes náročné chytáky se ve starší české literatuře dokonale orientujete.";
            } else if (percent >= 50) {
                resultDiv.style.color = '#f39c12';
                resultDiv.innerHTML += "<br>Velmi slušné. Otázky byly těžké a obsahovaly mnoho matoucích detailů, rámečky vám ale jistě napoví.";
            } else {
                resultDiv.style.color = '#c0392b';
                resultDiv.innerHTML += "<br>Látka byla zjevně velmi náročná. Je tu hodně letopočtů a jmen – pozorně si pročtěte zdůvodnění špatných odpovědí.";
            }
        }
