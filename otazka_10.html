    <h1>Státnicový test z ČJ (Otázka 10)</h1>
    <div class="subtitle">Didaktická interpretace lyriky, Poezie 60. – 80. let, Oldřich Mikulášek a další básníci<br><strong>Vyberte odpověď – výsledek a zdůvodnění se zobrazí okamžitě.</strong></div>
    
    <div id="quiz-container"></div>
    
    <button onclick="zobrazitKonecneSkore()">Zobrazit celkové skóre</button>
    <div id="result"></div>

    <script>
        const otazky = [
            // Didaktika
            { q: "Jaký je hlavní rozdíl mezi tzv. lyrikou bezprostřední (autoreprezentační) a lyrikou předmětnou (objektovou) z hlediska čtenářské percepce?", options: [
                "V bezprostřední lyrice čtenář zkoumá historické pozadí a politické názory autora, zatímco v předmětné lyrice se zabývá pouze formální strukturou rýmů a rytmu.", 
                "Bezprostřední lyrika je založena na osobní výpovědi a pocitu mluvčího (čtenář pátrá po jeho životním naladění), kdežto předmětná lyrika se orientuje na úsek vnější skutečnosti a její atmosféru.", 
                "Předmětná lyrika nevyžaduje od čtenáře žádnou představivost, neboť jde o objektivní výčet faktů, kdežto bezprostřední lyrika je zcela snová a postrádá jakýkoliv ukotvený význam.", 
                "V bezprostřední lyrice se mluvčí vždy obrací přímo k Bohu formou modlitby, zatímco předmětná lyrika je určena k veřejnému předčítání a apeluje na sociální změny ve společnosti."
            ], a: 1, exp: "Bezprostřední lyrika je osobní výpovědí lyrického subjektu o pocitu či stavu (čtenář pátrá po naladění). Předmětná lyrika je orientována na vnější skutečnost (objekt) a čtenář v ní hledá atmosféru a úhel pohledu na tuto skutečnost." },
            { q: "Proč představuje práce s lyrickou poezií pro starší žáky (zejména pubescenty) tak významnou čtenářskou bariéru a jaký mají tito žáci tendenční přístup k jazyku?", options: [
                "Pubescenti totiž vnímají jazyk převážně jako estetický nástroj, což vede k tomu, že v lyrice hledají výhradně složité zvukové figury a ignorují samotný obsah sdělení.", 
                "Tito žáci vyžadují od literatury pouze přísně chronologické vyprávění s historickou přesností; lyrika jim proto bez pevné dějové osy připadá příliš popisná a zmatečná.", 
                "Pubescent má tendenci sledovat spíše věcné informace a jazyk chápe především jako prostředek k předání informací (jako 'věc'). V lyrice je ale nutné slovo chápat jako 'znak' nesoucí emoce.", 
                "Bariéra spočívá v tom, že pubescenti odmítají číst nahlas před kolektivem; jejich prekoncepty jsou stavěny pouze na vizuálních vjemech, což znemožňuje interpretaci psaného slova."
            ], a: 2, exp: "Bariéra spočívá v tom, že pubescent chápe slovo převážně jako nástroj k předání informace ('věc'). Lyrika naopak vyžaduje emocionální komunikaci a uplatňování znakového modelu při interpretaci (slovo je 'znak' nesoucí psychické obsahy)." },
            { q: "Z jakého důvodu je didakticky tolik podstatný kvalitní hlasitý přednes lyrické básně hned na počátku práce s tímto literárním textem?", options: [
                "Hlasitý přednes slouží primárně k tomu, aby učitel zjistil, zda žáci umí bezchybně recitovat text z listu a dodržovat správnou divadelní dikci a dýchání.", 
                "Tichá četba by u žáků vedla k okamžité ztrátě motivace, protože by báseň přečetli příliš rychle a následně by zbytek vyučovací hodiny z nudy vyrušovali.", 
                "V mnoha básních hraje významotvornou roli zvuková kvalita jazyka. Teprve hlasitý přednes dokáže v recipientovi navodit auditivní představy a podnítit ho k jejich smyslovému prožívání.", 
                "Přednes je klíčový pouze u básní napsaných ve staročeštině, kde hlasitá artikulace pomáhá učiteli odhalit a vysvětlit žákům správný význam zastaralých a neznámých slov."
            ], a: 2, exp: "V lyrice hraje významotvornou roli zvuková kvalita poetického jazyka. Teprve kvalitní hlasitý přednes dokáže v žákovi navodit potřebné auditivní představy a motivovat ho k hlubšímu smyslovému prožívání básně." },
            { q: "V didaktice lyriky se často uplatňuje tvořivá tzv. 'metoda substituce'. V čem přesně spočívá a k čemu žákům v praxi pomáha?", options: [
                "Využívá se tehdy, když žáci nedokáží vyjádřit pocit z četby. Učitel se jich ptá na substituty (např. jakou by měla báseň barvu, zvuk či tvar), což přispívá k intuitivnímu uchopení obsahu.", 
                "Spočívá v tom, že žáci musí v textu systematicky vyhledat a nahradit (substituovat) všechna slovesa jejich přesnými historickými synonymy, čímž vznikne nová báseň v archaickém stylu.", 
                "Metoda se uplatňuje v závěru hodiny a spočívá v tom, že učitel nahradí vybranou těžkou báseň jiným, mnohem lehčím prozaickým textem, pokud vidí, že žáci předlohu nepochopili.", 
                "Jde o aktivitu, při níž žáci zcela ignorují původní obsah básně a místo toho mají za úkol k předloženým rýmům vymyslet naprosto odlišnou, fantaskní epickou zápletku."
            ], a: 0, exp: "Metoda substituce pomáhá žákům ve chvíli, kdy nedokáží slovně vyjádřit pocit z textu. Nabídnutím substituce (Jakou má báseň barvu? Jakým hudebním nástrojem byste ji vyjádřili?) se rozvíjí jejich představivost a estetická citlivost." },
            { q: "Co obnáší didaktická činnost zvaná 'rekonstrukce' při interpretaci lyrické básně?", options: [
                "Je to historická metoda, kdy učitel pustí žákům dokumentární film o životě básníka a ti následně rekonstruují a sepisují události, které mohly ovlivnit vznik daného díla.", 
                "Spočívá ve vytváření obrazného záznamu dojmů (např. formou kresby nebo abstraktní malby), který má vyjádřit atmosféru textu, aniž by žáci použili jediné slovo.", 
                "Je to technika, při které se žáci učí nazpaměť celou báseň a následně ji musí doslova a do písmene zrekonstruovat na papír bez jediné gramatické či rytmické chyby.", 
                "Znamená úmyslné vynechání určitých částí básně (např. závěru nebo paralelního výčtu) s didaktickým záměrem; úkolem žáků je text dotvořit a následně své řešení porovnat s originálem."
            ], a: 3, exp: "Rekonstrukce spočívá v dotváření záměrně vynechaných částí básně žáky. Ti musí logicky a esteticky navázat na předchozí text a následně se jejich varianta komparuje s autorovým originálem." },
            { q: "Jaký cíl sleduje didaktická aktivita 'báseň s mnoha konci'?", options: [
                "Učitel předloží žákům báseň bez posledního verše. Žáci v časovém limitu tvoří vlastní pointu, což je vede k hlubšímu zamyšlení nad smyslem a následně umožní komparaci jejich řešení s autorovým poselstvím.", 
                "Žáci jsou rozděleni do skupin a každá skupina interpretuje konec básně z hlediska jiné literární epochy, čímž se učí rozpoznávat rozdíly mezi romantismem, realismem a avantgardou.", 
                "Cílem je naučit žáky psát rýmované verše na rychlost; vítězí ten žák, který k dané slokové struktuře dokáže vymyslet nejvíce významově nezávislých, ale rytmicky přesných závěrů.", 
                "Metoda slouží k procvičování paměti; žáci musí k předloženým koncům básní správně přiřadit jména jejich autorů a názvy sbírek, z nichž pocházejí."
            ], a: 0, exp: "Při této metodě si žáci uvědomí, že poslední verš je pointou a přináší poselství. Tím, že sami tvoří vlastní závěr (cca 10 min), se do textu ponoří. Teprve po napsání na tabuli se přečte originál a diskutuje se o něm." },

            // Poezie 60. let
            { q: "Jaké formální a tematické změny charakterizují českou básnickou tvorbu v období liberalizace 60. let 20. století?", options: [
                "Poezie se plně oprostila od osobních emocí a společenských témat a stala se ryze vizuálním uměním; básníci tvořili pouze tzv. kaligramy určené pro výtvarné galerie.", 
                "Byla to doba, kdy se poezie sjednotila do jednoho proudu; zcela zanikly literární skupiny a všichni autoři publikovali pouze krátké epigramy zaměřené na kritiku studené války.", 
                "Dochází k rozšiřování tvarové škály, přechodu k volnému verši, uplatňování autorské plurality a rozmanitosti přístupů. Zřetelně narůstá využívání dramatičnosti, konfliktnosti a lyrické meditativnosti.", 
                "Tato dekáda znamenala definitivní návrat k přísně pravidelnému rytmu a rýmu, autoři odmítli experimenty a soustředili se na radostné budovatelské verše opěvující úspěchy pětiletek."
            ], a: 2, exp: "Poezie 60. let (díky uvolnění cenzury) přinesla rozvolnění pravidelného rýmování, přechod k volnému verši, růst náročnosti vnímatelů, autorskou pluralitu a zjevný nárůst dramatičnosti, reflexe a meditativnosti v textech." },
            { q: "Který z předních básníků, původním povoláním špičkový imunolog, je autorem sbírek 'Slabikář' a 'Ačkoli', a jak se jeho profese promítla do jeho poezie?", options: [
                "Byl to Karel Šiktanc; ve svých verších ostře napadal dopady moderní techniky na přírodu a obhajoval návrat ke keltskému způsobu života bez výzkumných laboratoří.", 
                "Miroslav Holub; v jeho tvorbě dominuje racionalita, věcné pojmenování a logika. Verše odrážejí důvěru ve vývoj člověka a přesné vnímání světa s využitím odborných postřehů.", 
                "Byl jím Ivan Diviš; svá lékařská bádání zcela oddělil od umění a básně psal úmyslně ve formě složitých mystických zaříkávadel a středověkých proseb k Bohu.", 
                "Jednalo se o Jana Skácela; z vědeckého prostředí čerpal pouze názvy svých sbírek, zatímco samotný obsah tvořily výhradně melancholické vzpomínky na dětství na moravském venkově."
            ], a: 1, exp: "Miroslav Holub byl lékař a imunolog. V jeho poezii všedního dne (Slabikář, Ačkoli, Karni teče krev) je patrná velká racionalita, věcnost, využití exaktních poznatků z profesí a dominance sebejistoty s důvěrou v poznání člověka." },
            { q: "Rozsáhlá poema 'Heinovské noci' od Karla Šiktance (představitele generace Května) zpracovává jaké tíživé historické téma?", options: [
                "Báseň s hořkou ironií zprostředkovává pocity marnosti a zrady během srpnové noci roku 1968, kdy do Prahy vpadla vojska Varšavské smlouvy.", 
                "Jedná se o hluboký osobní prožitek a zprostředkování děsu jedné noční hodiny z pohledu chlapce ukrytého nedaleko Kladna, čímž básník evokuje vyhlazení Lidic.", 
                "Vypráví epický příběh o nočních výsleších politických vězňů v padesátých letech; formou dopisů matce zachycuje utrpení a beznaděj odsouzených intelektuálů.", 
                "Představuje meditativní dialog básníka s antickými filozofy, který se odehrává ve snové krajině a zkoumá základní otázky smyslu lidské existence po ničivé morové epidemii."
            ], a: 1, exp: "Poema Heinovské noci velice intimně a s mrazením zprostředkovává osudnou noc lidické tragédie prostřednictvím prožitků, děsů a bezmoci chlapce ukrytého té noci nedaleko Kladna." },
            { q: "O čem pojednává lyrickoepická skladba Františka Hrubína 'Romance pro křídlovku' a jak v ní autor pracuje s dějovou linkou?", options: [
                "Skladba spojuje mystický příběh o putování za svatým grálem s pohanskými rituály; Hrubín zde záměrně používá archaismy a epická rovina naprosto dominuje nad osobními pocity.", 
                "Dílo vypráví dojemný příběh studenta Vojty, který prožívá první lásku (k Terině z kolotočů) i první setkání se smrtí (dědečka). Epická rovina příběhu je zde však záměrně potlačena na úkor hlubokého lyrického vyznání a reflexe plynutí času.", 
                "Báseň je surovým vyprávěním o životě zrazených bojovníků z pražského povstání; v epické rovině líčí stavbu barikád a v lyrické části oslavuje příchod osvobozenecké armády do zničeného města.", 
                "Hrubín se zde vrací k žánru klasické pohádky; děj vypráví o lásce chudého muzikanta k princezně, přičemž veškeré meditativní a smutné prvky jsou zcela potlačeny ve prospěch šťastného konce."
            ], a: 1, exp: "Romance pro křídlovku je stěžejní Hrubínovo dílo postavené na kontrastu probouzející se lásky (k Terině) a smrti (umírající dědeček). Dějová (epická) linie je potlačena, dílu dominuje hluboká lyrická reflexe zestárlého autora nad marností, ztrátou a plynutím času." },
            { q: "Složitá básnická skladba Vladimíra Holana 'Noc s Hamletem' představuje jedno z vrcholných děl české poezie. Jakou má formu a co je jejím ústředním sdělením?", options: [
                "Dílo bylo sepsáno jako obrovský optimistický oslavný epos na počest letů do vesmíru, kde princ Hamlet představuje prvního kosmonauta, který promlouvá k básníkovi o zářivé budoucnosti lidstva.", 
                "Skladba je humornou divadelní adaptací, kde Holan ironizuje tehdejší komunistické politiky a zasazuje děj Shakespearovy hry přímo do prostředí dobového sjezdu Svazu spisovatelů.", 
                "Je to podobenství zjevující tragický úděl člověka. Lyrický mluvčí v noci vede temnou, složitou a symbolickou rozmluvu s princem Hamletem, v níž polemizuje s konvencemi, iluzemi a nesvobodou, přičemž zkoumá tajemství bytí a samoty.", 
                "Jedná se o sbírku krátkých, rytmických říkadel pro děti, jež mají formou jednoduchých hádanek oslavovat příchod jara a zjednodušeně vysvětlit dětem zápletku slavné anglické divadelní hry."
            ], a: 2, exp: "Noc s Hamletem je nesmírně hlubokou, složitou a abstraktní básní. Lyrický mluvčí v ní v noci rozmlouvá s Hamletem, což autorovi slouží jako východisko k meditativnímu ponoru do samoty, tragiky člověka a k polemice s konvencemi, iluzemi a nesvobodou světa." },
            { q: "Jaký zásadní posun a naladění jsou charakteristické pro pozdní, bilanční sbírky Jaroslava Seiferta ze 60. až 80. let (např. 'Koncert na ostrově', 'Morový sloup', 'Odlévání zvonů')?", options: [
                "Tyto sbírky představují jeho hluboké vzpomínkové a bilanční pásmo. Básník postupně opouští vázaný rým, přechází k volnému, střídmějšímu verši a jeho díla jsou prostoupena motivy stárnutí, melancholie, pocitů tísně a neodvratné konečnosti.", 
                "Seifert se v nich nečekaně vrací ke svým počátkům z doby proletářské poezie; jeho pozdní verše jsou opět plné bojovných hesel o světové revoluci, uplatňují úderné refrény a postrádají jakoukoliv melancholii.", 
                "Jeho poslední sbírky jsou složeny pouze z absurdních, úsečných a nesrozumitelných zvolání; Seifert tím chtěl cíleně vyjádřit naprosté opovržení nad literárními formami během nudných let normalizace.", 
                "Autor se v tomto období zaměřil výhradně na oslavu krás Prahy prostřednictvím přísných, klasických sonetů, čímž chtěl dokázat, že i v moderní době má tradiční rýmovaná forma své pevné a neotřesitelné místo."
            ], a: 0, exp: "V pozdním období Seifert opustil svou typickou zpěvnou formu a přešel k volnému verši. Jeho poezie se stala mnohem strožejší, bilancující a hluboce reflexivní, výrazně se v ní prosadily pocity stárnutí, melancholie, tísně, konečnosti a osobních vzpomínek." },

            // Skácel, Diviš, Wernisch a další
            { q: "Brněnský básník Jan Skácel (autor sbírek 'Kolik příležitostí má růže' či 'Smuténka') je známý svou zcela specifickou poetikou. Které znaky jeho poezii nejlépe vystihují?", options: [
                "Skácel agresivně analyzuje destrukci moderního západního průmyslu, odmítá jakékoliv tradice a jeho díla připomínají chaotickou změť drsných industriálních hesel bez zjevného rytmu.", 
                "Jeho tvorba se vyznačuje úžasně dlouhými, mnohastránkovými veršovanými příběhy s detektivní zápletkou, přičemž k vyjádření užívá nejkomplikovanějších cizojazyčných slovíček pro ohromení čtenáře.", 
                "Pro jeho poetiku je typická obrovská lapidárnost (stručnost) a úspornost slovního vyjádření. Snaží se o harmonii sdělení, dekorativnost stylu a často formou čtyřverší oslavuje prvotní jistoty, ticho a sepětí s přírodou.", 
                "Psal výhradně temné, hororové básně v podobě dlouhých rozhovorů mezi mrtvými, čímž zcela popřel svou optimistickou náturu; jeho klíčovým dílem je depresivní sborník balad o utonulých dětech."

            { q: "Ivan Diviš, významný exilový básník a autor sbírek 'Eliášův oheň' či 'Chrlení krve', se prezentuje velmi osobitým literárním stylem. Jak byste charakterizovali jeho lyrický projev?", options: [

            { q: "„Uvidíš, jen své oči zavři. / Nad hladinou vyskakují rybky / a některá se chytí. / Je tichá jak vzduch jarní v habří, / nepláče, jen se třpytí.“ - Jakou neúprosnou existenciální hrozbu a postoj k ní představují tyto verše?", options: [

            { q: "„Viděl jsem malou rybičku, / jak polykala vodičku. / Rybičko, ty němá tváři, / do marné skřely si mne zavři, / budu tvou vodu píti.“ - Co vyjadřují tyto bolestně melancholické, závěrečné verše lyrického mluvčího v posledním zoufalém loučení se s marně chycenou obětí?", options: [
                "Autor se posměšně raduje z bohatého úlovku, ulovenou malou rybičku na břehu provokativně potupí a v opilosti se snaží napít co nejvíce říční vody, aby utišil svou touhu po masité pečené pochoutce.",

                "Verše popisují s bezbřehým optimismem úspěšné nasazení moderní ekologie, kdy se uměle vychované ubohé dusící se rybičky nakonec dočkaly slastného vpuštění zpět do modré řeky; básník jim přeje do života dlouhý úspěch plný zdraví, bez konce v síti."
            ], a: 2, exp: "Poslední sloka graduje a ukazuje sklíčený pocit uvíznutí. Rybička z marnosti v osamění na suchu potichu hyne. Básník (který dříve obdivoval její svobodu) pociťuje sžíravou lítost a beznaděj. Jeho závěrečná tichá a bolestná prosebná věta ukazuje naprostou ochotu k identifikaci s obětí a marnou, plačící snahu sdílet s ní její krutý a osamělý konečný osud ubitého hrdiny." }
        ];

        let score = 0;
        let answeredQuestions = 0;

        const container = document.getElementById('quiz-container');

        // Generování HTML a okamžité vyhodnocení
        otazky.forEach((otazka, index) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `q-card-${index}`;
            
            const title = document.createElement('div');
            title.className = 'question-title';
            title.textContent = `${index + 1}. ${otazka.q}`;
            card.appendChild(title);

            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'options';

            otazka.options.forEach((opt, optIndex) => {
                const label = document.createElement('label');
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = `q${index}`;
                radio.value = optIndex;
                
                radio.addEventListener('change', function() {
                    const currentCard = document.getElementById(`q-card-${index}`);
                    const allRadios = currentCard.querySelectorAll('input[type="radio"]');
                    const labels = currentCard.querySelectorAll('label');
                    const expDiv = document.getElementById(`exp${index}`);
                    
                    // Uzamknutí otázky
                    allRadios.forEach(r => r.disabled = true);
                    currentCard.classList.add('locked');

                    const selectedVal = parseInt(this.value);
                    const correctVal = otazky[index].a;

                    labels[correctVal].classList.add('correct');

                    if (selectedVal === correctVal) {
                        score++;
                        expDiv.className = 'explanation success';
                        expDiv.innerHTML = `<strong>Správně!</strong><br><strong>Zdůvodnění:</strong> ${otazky[index].exp}`;
                    } else {
                        labels[selectedVal].classList.add('incorrect');
                        expDiv.className = 'explanation error';
                        expDiv.innerHTML = `<strong>Špatně.</strong><br>
                                            <strong>Správná odpověď:</strong> <em>${otazky[index].options[correctVal]}</em><br>
                                            <strong>Zdůvodnění:</strong> ${otazky[index].exp}`;
                    }
                    expDiv.style.display = 'block';
                    answeredQuestions++;
                });

                label.appendChild(radio);
                label.appendChild(document.createTextNode(opt));
                optionsDiv.appendChild(label);
            });

            card.appendChild(optionsDiv);

            const explanationDiv = document.createElement('div');
            explanationDiv.className = 'explanation';
            explanationDiv.id = `exp${index}`;
            card.appendChild(explanationDiv);

            container.appendChild(card);
        });

        // Finální shrnutí na konci
        function zobrazitKonecneSkore() {
            const resultDiv = document.getElementById('result');
            
            if (answeredQuestions < otazky.length) {
                resultDiv.style.color = '#e67e22';
                resultDiv.innerHTML = `Zatím jste odpověděl/a na ${answeredQuestions} z ${otazky.length} otázek. <br> Průběžné skóre: ${score} správně.`;
                return;
            }

            const percent = Math.round((score / otazky.length) * 100);
            resultDiv.innerHTML = `Váš konečný výsledek: ${score} z ${otazky.length} bodů (${percent} %).`;
            
            if(percent >= 80) {
                resultDiv.style.color = '#27ae60';
                resultDiv.innerHTML += "<br>Úctyhodný výkon! V didaktice i poezii se orientujete skvěle.";
            } else if (percent >= 50) {
                resultDiv.style.color = '#f39c12';
                resultDiv.innerHTML += "<br>Velmi slušné. Otázky vyžadovaly znalost mnoha nuancí, projděte si rámečky pro upevnění látky.";
            } else {
                resultDiv.style.color = '#c0392b';
                resultDiv.innerHTML += "<br>Látka byla zjevně velmi náročná. Je tu hodně autorů a pojmů – pozorně si pročtěte zdůvodnění špatných odpovědí.";
            }
        }
    </script>
</body>
</html>
