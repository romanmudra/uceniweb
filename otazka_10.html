    <h1>Státnicový test z ČJ (Otázka 10)</h1>
    <div class="subtitle">Didaktická interpretace lyrické básně, Poezie 60. – 80. let, Oldřich Mikulášek a další básníci<br><strong>Vyberte odpověď – výsledek a zdůvodnění se zobrazí okamžitě.</strong></div>
    
    <div id="quiz-container"></div>
    
    <button onclick="zobrazitKonecneSkore()">Zobrazit celkové skóre</button>
    <div id="result"></div>

    <script>
        const otazky = [
            // Didaktika lyriky
            { q: "Jaký je hlavní rozdíl mezi tzv. lyrikou bezprostřední (autoreprezentační) a lyrikou předmětnou (objektovou) z hlediska čtenářské recepce a role lyrického mluvčího?", options: [
                "V bezprostřední lyrice vystupuje lyrický mluvčí vždy výhradně jako neutrální pozorovatel popisující historické děje v třetí osobě, kdežto v lyrice předmětné se mluvčí vždy identifikuje s autorem a popisuje výhradně své vlastní traumatické vzpomínky z dětství bez vnějšího vlivu.", 
                "Bezprostřední lyrika je založena na osobní výpovědi lyrického subjektu o vlastním vnitřním prožitku, pocitu a stavu (čtenář pátrá po životním naladění subjektu), zatímco předmětná lyrika je orientovaná na konkrétní objekt či úsek vnější skutečnosti (čtenář hledá atmosféru a perspektivu nazíraného světa).", 
                "Předmětná lyrika nevyžaduje od čtenáře žádnou představivost, neboť se jedná pouze o faktografický výčet dat a místopisných údajů, kdežto bezprostřední lyrika je natolik abstraktní a snová, že se v ní lyrický mluvčí zcela rozpouští a text přestává dávat jakýkoliv syntaktický smysl.", 
                "V bezprostřední lyrice se autor snaží prostřednictvím dlouhých refrénů apelovat na kolektivní svědomí čtenářů k politické akci, zatímco předmětná lyrika je výlučně intimní formou zpovědi určenou k předčítání pouze v soukromí, bez jakékoliv snahy zachytit atmosféru okolí."
            ], a: 1, exp: "Poznámky jasně definují tyto dva typy: Bezprostřední lyrika je osobní výpovědí lyrického subjektu (pocity, stavy, čtenář uvažuje o naladění subjektu). Předmětná (objektová) lyrika je orientovaná na konkrétní objekt či úsek vnější skutečnosti (čtenář vnímá perspektivu, atmosféru a potřebuje vnímavost pro imaginární svět a úhel pohledu mluvčího)." },
            { q: "Proč představuje práce s lyrickou poezií pro starší žáky (zejména pubescenty) tak významnou čtenářskou bariéru a jaký mají tito žáci přirozený tendenční přístup k jazyku?", options: [
                "Pubescenti totiž vnímají jazyk a slovo převážně jako ryze estetický nástroj, což vede k tomu, že v lyrice hledají výhradně složité rýmy a metafory a zcela ignorují jakýkoli skrytý psychický obsah nebo emocionální pocity, které báseň zprostředkovává.", 
                "U pubescentů se plně vytrácí schopnost plynule číst nahlas, a proto lyrickou poezii odmítají; jejich prekoncepty jsou stavěny pouze na vizuálních vjemech z moderních komiksů a filmů, což znemožňuje jakýkoli verbální prožitek z textu.", 
                "Tito žáci mají z vývojového hlediska silnou tendenci vnímat text a slovo převážně jako 'věc' (nástroj k předání věcné informace), kdežto v lyrice je nutné chápat slovo jako 'znak', v němž jsou zakódovány psychické obsahy a emotivní prožitky.", 
                "Problém spočívá v tom, že pubescentní žáci vyžadují od literatury pouze přísně chronologické vyprávění s historickou přesností; jelikož lyrika často uplatňuje přísně lineární děj bez emocí, připadá jim příliš nudná a popisná."
            ], a: 2, exp: "Bariéra spočívá v tom, že pubescent má tendenci sledovat spíše věcné informace a jazyk chápe jako nástroj k předání informací (slovo jako 'věc'). Lyrika však vyžaduje emocionální komunikaci a uplatňování znakového modelu (slovo jako 'znak', v němž jsou zakódovány emotivní prožitky a psychické obsahy)." },
            { q: "Z jakého důvodu je didakticky tolik podstatný a důležitý hlasitý umělecký přednes lyrické básně hned na počátku práce s tímto literárním textem?", options: [
                "Hlasitý přednes slouží primárně k tomu, aby učitel okamžitě zjistil, zda žáci umí bezchybně recitovat dlouhé pasáže zpaměti, a mohl je tak hned v úvodu hodiny známkovat za správné dýchání a artikulaci.", 
                "V mnoha básních hraje zásadní a významotvornou roli zvuková kvalita poetického jazyka. Teprve hlasitý umělecký přednes dokáže u posluchačů (recipientů) navodit správné auditivní představy a plně podnítit jejich smyslové prožívání zakódovaných emocí.", 
                "Tichá četba by u žáků vedla k okamžité ztrátě motivace, protože by báseň přečetli příliš rychle a následně by zbytek hodiny vyrušovali; hlasitý přednes tak slouží převážně jako prostředek k udržení disciplíny a pozornosti ve třídě.", 
                "Přednes je důležitý pouze u básní napsaných ve staročeštině, kde hlasitá artikulace pomáhá učiteli odhalit a vysvětlit žákům správný význam zastaralých a neznámých pojmů, aniž by se museli zabývat celkovou náladou díla."
            ], a: 1, exp: "Zvuková kvalita poetického jazyka hraje v lyrice ohromnou roli. Teprve hlasitý a přednes (ideálně učitelův) dokáže v recipientovi navodit potřebné auditivní představy a podnítit ho k plnému smyslovému prožívání básně. U tiché četby hrozí, že se interakce zredukuje pouze na vizuální recepci a promarní se příležitost motivace." },
            { q: "V didaktice lyriky se uplatňuje tzv. 'metoda substituce'. V čem přesně tato tvořivá metoda spočívá a v jaké fázi práce s textem se obvykle využívá?", options: [
                "Metoda se uplatňuje až v samotném závěru vyučovací hodiny a spočívá v tom, že učitel substitučně nahradí vybranou těžkou báseň jiným, mnohem lehčím textem od stejného autora, pokud vidí, že žáci původní dílo vůbec nepochopili.", 
                "Tato metoda se využívá v percepční a apercepční fázi (při vnímání a utváření vnitřních představ) a nabízí se v situaci, kdy žáci nedokáží slovně vyjádřit svůj pocit z četby; učitel jim pomáhá tím, že se ptá, jakou by báseň měla barvu, vůni či tvar, kdyby ji bylo možné takto substituovat.", 
                "Jde o přísně lingvistický postup z fáze konkretizace, kdy studenti musí v textu systematicky vyhledat a nahradit (substituovat) všechna slovesa a podstatná jména jejich přesnými historickými synonymy, čímž vznikne zcela nová báseň v archaickém stylu.", 
                "Využívá se především ve fázi interpretace a spočívá v tom, že žáci musí zcela ignorovat původní obsah básně a místo toho mají za úkol vymyslet k úryvku naprosto odlišnou, fantaskní epickou zápletku."
            ], a: 1, exp: "Metoda substituce se využívá v percepční a apercepční fázi. Pomáhá žákům, kteří nedokáží vyjádřit své pocity přímo z textu. Učitel jim proto nabízí substituční otázky typu: 'Jakou má báseň barvu?', 'Kdybyste báseň zhudebnili, jakým nástrojem?', 'Jaký by měla tvar?', čímž rozvíjí jejich estetickou citlivost a imaginaci." },
            { q: "Co obnáší didaktická činnost zvaná 'rekonstrukce' při práci s lyrickou básní?", options: [
                "Je to technika, při které se žáci učí nazpaměť celou báseň a následně ji musí doslova a do písmene zrekonstruovat na papír bez jediné gramatické chyby, čímž se procvičuje jejich vizuální a sémantická paměť.", 
                "Spočívá ve vytváření obrazného záznamu dojmů (např. formou kresby nebo abstraktní malby), který má vyjádřit celkovou atmosféru textu, aniž by žáci k vyjádření použili jediné slovo.", 
                "Znamená záměrné vynechání určitých částí básně (např. závěru, určitého rýmu nebo paralelního výčtu motivů) s určitým didaktickým záměrem; úkolem žáků je tyto chybějící části tvořivě dotvořit a následně své návrhy porovnat s originálem.", 
                "Představuje historickou rekonstrukci dobového pozadí, kdy učitel žákům pustí dokumentární film o životě básníka a žáci z něj musí vypsat všechny klíčové události ovlivňující vznik básně."
            ], a: 2, exp: "Rekonstrukce znamená dotváření určitých vynechaných částí básně (často závěru, konce básně apod.) žáky, kteří je chápou v kontextu předchozího textu, a jejich následné srovnání s autorovým originálem." },

            // Poezie 60. let a mladší generace
            { q: "Jaké zásadní a formální rysy charakterizují českou básnickou tvorbu v 60. letech 20. století (tzv. období uvolnění) ve srovnání s poezií z 50. let?", options: [
                "Tato dekáda znamenala definitivní a striktní návrat k přísně pravidelnému rytmu a rýmu, autoři zcela odmítli experimenty a soustředili se výhradně na oslavu státních představitelů a radostné budovatelské verše opěvující rozvoj zemědělství.", 
                "Byla to doba, kdy se poezie sjednotila do jednoho mohutného proudu tzv. existencialismu; zcela zanikly jakékoliv literární skupiny a všichni autoři publikovali pouze krátké, epigramatické básně zaměřené výhradně na kritiku studené války.", 
                "Dochází k obrovskému rozšiřování tvarové škály, rozvolnění a rozbití pravidelného rýmování, k masivnímu přechodu k volnému verši, uplatňování autority a rozmanitosti přístupů. Zřetelně narůstá využívání konfliktnosti, dramatičnosti, meditativnosti a reflexe dobových událostí prostřednictvím složitých lyricko-epických skladeb.", 
                "Poezie 60. let se naprosto oprostila od jakýchkoliv emocí a společenských témat a stala se ryze vizuálním uměním; básníci tvořili pouze tzv. kaligramy (básně-obrazy) určené pro výtvarné galerie, přičemž psané slovo zcela ztratilo svou sdělovací funkci."
            ], a: 2, exp: "Pro 60. léta je charakteristické uvolnění politického klimatu, což se v poezii projevilo růstem náročnosti vnímatelů, rozvolňováním tvarové škály (rozbití pravidelného rýmu, přechod k volnému verši), využíváním dramatičnosti a konfliktnosti, uplatňováním autorské plurality a rozmanitosti a celkovým nárůstem meditativní a lyricko-epické tvorby." },
            { q: "Který z následujících básníků patřil mezi výrazné představitele mladé básnické generace (narozené kolem r. 1930) a debutoval s verši reflektujícími často syrové poznání světa, civilizační pokrok i skepsi z přechodu do dospělosti, přičemž se v 60. letech výrazně podílel na formování literárního časopisu Květen?", options: [
                "Jaroslav Seifert", 
                "Karel Šiktanc", 
                "Jan Zahradníček", 
                "Vladimír Holan"
            ], a: 1, exp: "Karel Šiktanc (nar. 1928, debutoval po r. 1950, představitel 'generace Května') patřil k mladším básníkům, kteří vnášeli do literatury uvolnění od stalinistického schématu. Mezi mladé autory Května či širšího okruhu kolem něj patřili i Miroslav Florian, Miroslav Holub či Jiří Šotola." },
            { q: "Jaký stěžejní námět zpracovává rozsáhlá a pochmurná poema 'Heinovské noci' od Karla Šiktance?", options: [
                "Báseň s ironií a vtipem zprostředkovává bujaré studentské noční oslavy po pádu stalinismu v pražských hospodách, přičemž oslavuje nově nabytou svobodu a uvolněné literární mravy 60. let.", 
                "Představuje meditativní dialog básníka s antickými filozofy, který se odehrává ve snové krajině starověkého Řecka a zkoumá základní otázky smyslu lidské existence a touhy po nesmrtelnosti.", 
                "Jedná se o hluboký osobní prožitek dvou tichých, mrazivých nočních hodin, které v naprosté bezmoci prožívá chlapec ukrytý nedaleko Kladna, čímž básník zprostředkovává nepředstavitelný děs a krutost spojenou s osudnou nocí vyhlazení Lidic.", 
                "Vypráví epický příběh o osudech politických vězňů v jáchymovských uranových dolech; formou dopisů matce zachycuje utrpení, beznaděj, ale i drobnou naději mladých bratrů odsouzených na doživotí."
            ], a: 2, exp: "Poema Heinovské noci od K. Šiktance velice intimně a s mrazením zprostředkovává osudnou noc lidické tragédie prostřednictvím prožitků, děsů a bezmoci chlapce ukrytého nedaleko Kladna, který vnímá hrůznost tohoto vyhlazení." },
            { q: "Miroslav Holub, jeden z velmi uznávaných básníků tzv. poezie všedního dne, byl původním a dlouholetým povoláním významný vědec. Jak se tato jeho exaktní profese odrazila v jeho poetice?", options: [
                "Zcela se od vědy distancoval a své básně psal úmyslně ve formě složitých středověkých zaříkávadel a mystických modliteb, aby tak unikl nudnému, racionálnímu světu pražských výzkumných laboratoří.", 
                "Ve své tvorbě uplatňoval velkou racionalitu, logiku a využívání přímočarého věcného pojmenování i odborných výrazů; jeho básně (např. ve sbírce Slabikář či Karni teče krev) představují precizní analýzu světa, nemoci a života a vyzařuje z nich dominance sebejistoty a důvěry v rozvoj člověka.", 
                "Vědecké postupy aplikoval výhradně tak, že všechny své básně šifroval pomocí složitých matematických vzorců a chemických rovnic, čímž vytvořil tzv. nesrozumitelnou poezii určenou jen a pouze úzkému okruhu svých kolegů z Akademie věd.", 
                "Byl zhnusen dopady moderní techniky na přírodu, a proto ve svých sbírkách (např. Ačkoli) plamenně a emocionálně obhajoval návrat ke keltskému způsobu života v souznění s přírodou a napadal jakýkoliv vědecký výzkum."
            ], a: 1, exp: "Miroslav Holub byl špičkový imunolog a v jeho poezii se odráží velká racionalita, využívání přesného věcného pojmenování (i lékařského či vědeckého) a logika. Sbírky jako Slabikář či Karni teče krev vynikají dominancí důvěry v rozvoj člověka a přesným vnímáním světa a jeho neduhů (např. problematiky nemocných)." },

            // František Hrubín, Vladimír Holan, Jaroslav Seifert (60.-80. léta)
            { q: "V 60. letech napsal František Hrubín rozsáhlou a slavnou lyrickoepickou skladbu 'Romance pro křídlovku'. Jaká dvě hlavní témata a roviny se v tomto díle osudově a melancholicky prolínají?", options: [
                "Báseň je krutým vyprávěním o životě zrazených bojovníků z pražského povstání; v epické rovině líčí stavbu strašidelných barikád a v lyrické části pak oslavuje příchod osvobozenecké Rudé armády do zničené Prahy v květnu 1945.", 
                "Prolíná se zde vyprávění o prosluněném a šťastném dospívání na Mělnicku s drsným, deziluzivním popisem autorových útrap z nucených prací v německé zbrojovce, což doplňují verše vzývající pád hitlerovského Německa.", 
                "Skladba spojuje vyprávění mystického příběhu o pouti do Santiaga de Compostela s drsným pohanským obětováním, přičemž se autor formou staročeštiny vrací až k pramenům národní, keltsko-slovanské dávné a temné minulosti.", 
                "Dílo vypráví dojemný příběh dospívajícího chlapce Vojty, který o letní pouti prožívá svou první osudovou milostnou fascinaci (Krásná Terina) i první setkání se smrtí (umírání dědečka). Tento děj se neustále potlačuje a střídá s hlubokou lyrickou rovinou básníkova bolestného ohlédnutí, vyznání a marné reflexe o pomíjivosti času."
            ], a: 3, exp: "Romance pro křídlovku je stěžejní Hrubínovo dílo z 60. let, postavené na silném kontrastu lásky (první probuzení citu k Terině z potulného kolotoče) a smrti (hlídání umírajícího dědečka). Dějová (epická) linie příběhu ustupuje neustálým reflexím a lyrickým vyznáním zestárlého autora o marnosti a míjení." },
            { q: "Co je hlavním tématem a znakem nesmírně obtížné a hluboce reflexivní básnické skladby 'Noc s Hamletem', kterou v tomto období dokončil Vladimír Holan?", options: [

        ];

        let score = 0;

        const container = document.getElementById('quiz-container');

        otazky.forEach((otazka, index) => {

            const title = document.createElement('div');

            title.textContent = `${index + 1}. ${otazka.q}`;

            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'options';

            otazka.options.forEach((opt, optIndex) => {
                const label = document.createElement('label');
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = `q${index}`;
                radio.value = optIndex;
                
                radio.addEventListener('change', function() {
                    const currentCard = document.getElementById(`q-card-${index}`);
                    const allRadios = currentCard.querySelectorAll('input[type="radio"]');
                    const labels = currentCard.querySelectorAll('label');
                    const expDiv = document.getElementById(`exp${index}`);
                    
                    // Uzamknutí otázky
                    allRadios.forEach(r => r.disabled = true);
                    currentCard.classList.add('locked');

                    const selectedVal = parseInt(this.value);
                    const correctVal = otazky[index].a;

                    labels[correctVal].classList.add('correct');

                optionsDiv.appendChild(label);

            }

            const percent = Math.round((score / otazky.length) * 100);
